  // On a device's very first sync, what is already in the account wins over same-id local copies.
  const now=Object.keys(SYNC.meta).length||SYNC.cursor?Date.now():1,recs=syncRecords();
  for(const[k,v]of recs){const h=h53(JSON.stringify(v)),m=SYNC.meta[k];if(!m||m.x||m.h!==h)SYNC.meta[k]={h,u:now,d:1}}
  for(const k in SYNC.meta)if(!recs.has(k)&&!SYNC.meta[k].x)SYNC.meta[k]={h:'',u:now,d:1,x:1};
  return recs;
}
function syncApply(r){
  const k=r.kind+':'+r.id,same=x=>String(x.id)===String(r.id);
  if(r.kind==='li')S.li=r.deleted?S.li.filter(x=>x.sample):(Array.isArray(r.data?.list)?r.data.list:[]);
  else{
    const key=r.kind==='person'?'clients':'deals',i=S[key].findIndex(same);
    if(r.deleted||!r.data){if(i>=0)S[key].splice(i,1)}
    else{if(r.kind==='person'){r.data.ints=r.data.ints||[];r.data.tasks=r.data.tasks||[]}if(i>=0)S[key][i]=r.data;else S[key].unshift(r.data)}
  }
  SYNC.meta[k]=r.deleted||!r.data?{h:'',u:r.updated_ms,d:0,x:1}:{h:h53(JSON.stringify(r.kind==='li'?{list:S.li}:r.data)),u:r.updated_ms,d:0};
}
async function sbFetch(path,opt={}){
  const{url,key}=sbConf();
  const res=await fetch(url+path,{method:opt.method||'GET',body:opt.body,headers:{apikey:key,'Content-Type':'application/json',...(SYNC.s&&!opt.noAuth?{Authorization:'Bearer '+SYNC.s.access_token}:{}),...(opt.headers||{})}});
  const txt=await res.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){}
  if(!res.ok)throw Object.assign(new Error(d?.error_description||d?.msg||d?.message||'HTTP '+res.status),{status:res.status});
  return d;
}
function sbSession(d){SYNC.s={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,id:d.user?.id||SYNC.s?.id,email:d.user?.email||SYNC.s?.email};syncStore()}
async function sbRefresh(){
  if(SYNC.s.exp-Date.now()>90e3)return;
  try{sbSession(await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',noAuth:true,body:JSON.stringify({refresh_token:SYNC.s.refresh_token})}))}
  catch(e){if(e.status>=400&&e.status<500){SYNC.s=null;throw new Error(t('Your session expired. Sign in again.'))}throw e}
}
function syncSet(state){SYNC.state=state;syncBadge();const el=$('#sync-panel');if(el)el.outerHTML=syncPanel()}
function syncBadge(){const b=$('#sync-btn');if(!b)return;b.hidden=SYNC.state==='off'&&!SYNC.err;b.className='icon-btn'+(SYNC.state==='syncing'?' busy':SYNC.state==='error'||SYNC.err?' err':'');b.innerHTML=ic('cloud');b.setAttribute('aria-label',t('Sync'));b.title=SYNC.err||t('Sync')}
function syncSoon(ms=1500){if(!SYNC.s)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncRun,ms)}
async function syncRun(){
  if(!SYNC.s)return;if(SYNC.busy){SYNC.again=true;return}
  SYNC.busy=true;syncSet('syncing');let changed=false;
  try{
    await sbRefresh();syncScan();
    for(;;){
      const rows=await sbFetch('/rest/v1/mnemo_items?select=kind,id,data,deleted,updated_ms,server_at&order=server_at.asc&limit=500'+(SYNC.cursor?'&server_at=gt.'+encodeURIComponent(SYNC.cursor):''));
      for(const r of rows){
        const m=SYNC.meta[r.kind+':'+r.id];SYNC.cursor=r.server_at;
        if(m&&((m.d&&m.u>=r.updated_ms)||(!m.d&&m.u===r.updated_ms&&!!m.x===!!r.deleted)))continue;
        syncApply(r);changed=true;
      }
      if(rows.length<500)break;
    }
    if(changed){if(hasSample()&&S.clients.some(c=>!c.sample)){const ids=new Set(S.clients.filter(c=>c.sample).map(c=>String(c.id)));S.clients=S.clients.filter(c=>!c.sample);S.deals=S.deals.filter(d=>!d.sample&&!ids.has(String(d.contactId)));S.li=S.li.filter(x=>!x.sample)}LIM=null;LKM=null;_save()}
    const recs=syncRecords(),dirty=Object.keys(SYNC.meta).filter(k=>SYNC.meta[k].d);
    for(let i=0;i<dirty.length;i+=50){
      const rows=dirty.slice(i,i+50).map(k=>{const m=SYNC.meta[k],j=k.indexOf(':');return{user_id:SYNC.s.id,kind:k.slice(0,j),id:k.slice(j+1),data:m.x?null:recs.get(k)??null,deleted:!!m.x,updated_ms:m.u}});
      await sbFetch('/rest/v1/mnemo_items?on_conflict=user_id,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
      rows.forEach(r=>{const m=SYNC.meta[r.kind+':'+r.id];if(m&&m.u===r.updated_ms)m.d=0});
    }
    SYNC.at=Date.now();SYNC.err='';syncStore();syncSet('idle');
  }catch(e){console.warn('sync',e);SYNC.err=e instanceof TypeError?t('Offline — changes are kept on this device and will sync later.'):e.message;syncStore();syncSet(SYNC.s?'error':'off')}
  finally{SYNC.busy=false;if(changed){if(S.sel&&!person(S.sel))S.sel=null;render()}if(SYNC.again){SYNC.again=false;syncSoon(300)}}
}
function syncPanel(){
  const c=sbConf(),inp=(id,l,x)=>`<label class="field"><span>${t(l)}</span><input class="input" id="${id}" ${x}></label>`;
  if(SYNC.s)return`<div id="sync-panel" style="display:flex;flex-direction:column;gap:10px"><p class="hint">${t('Signed in as')} <b style="color:var(--text)">${esc(SYNC.s.email||'')}</b> · ${SYNC.state==='syncing'?t('Syncing…'):SYNC.err?`<span style="color:var(--red)">${esc(SYNC.err)}</span>`:SYNC.at?t('Last synced')+' '+new Date(SYNC.at).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'}):t('Not synced yet')}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="sync-now">${t('Sync now')}</button><button class="btn sm" data-a="sync-out">${t('Sign out')}</button></div></div>`;
  return`<div id="sync-panel" style="display:flex;flex-direction:column;gap:10px"><p class="hint">${t('Sign in to keep your people, memories and deals in sync across your devices.')}${SYNC.err?` <span style="color:var(--red)">${esc(SYNC.err)}</span>`:''}</p>
    <div class="grid2">${inp('sync-email','Email','type="email" autocomplete="username"')}${inp('sync-pw','Password','type="password" autocomplete="current-password" data-enter="sync-in"')}</div>
    <details ${c.key?'':'open'}><summary class="hint" style="cursor:pointer">${t('Supabase project')}</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${inp('sync-url','Project URL',`value="${esc(c.url)}" placeholder="https://xxxx.supabase.co"`)}${inp('sync-key','Publishable (anon) key',`type="password" value="${esc(c.key)}" autocomplete="off"`)}</div></details>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-a="sync-in">${t('Sign in')}</button><button class="btn sm" data-a="sync-up">${t('Create account')}</button></div></div>`;
}
async function syncAuth(signup){
  const email=$('#sync-email').value.trim(),password=$('#sync-pw').value,url=$('#sync-url').value.trim(),key=$('#sync-key').value.trim();
  if(!/^https:\/\/[\w.-]+$/.test(url.replace(/\/+$/,''))||!key){toast(t('Enter your Supabase project URL and publishable key.'));return}
  if(!email||password.length<6){toast(t('Enter an email and a password of at least 6 characters.'));return}
  S.cfg.syncUrl=url;S.cfg.syncKey=key;saveCfg();SYNC.err='';
  try{
    const d=await sbFetch(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',noAuth:true,body:JSON.stringify({email,password})});
    if(!d?.access_token){toast(t('Account created. Confirm it from the email you just received, then sign in.'));return}
    if(SYNC.uid&&SYNC.uid!==d.user?.id){SYNC.meta={};SYNC.cursor=''}
    SYNC.uid=d.user?.id||'';SYNC.s=null;sbSession(d);syncSet('idle');toast(t('Signed in'));syncRun();
  }catch(e){toast(e instanceof TypeError?t('Could not reach Supabase. Check the project URL.'):e.message)}
}
A['sync-in']=()=>syncAuth(false);
A['sync-up']=()=>syncAuth(true);
A['sync-now']=()=>syncRun();
A['sync-out']=()=>{if(!confirm(t('Sign out? Your data stays on this device.')))return;const s=SYNC.s;if(s)sbFetch('/auth/v1/logout',{method:'POST'}).catch(()=>{});clearTimeout(SYNC.timer);Object.assign(SYNC,{s:null,uid:'',meta:{},cursor:'',at:0,err:''});syncStore();syncSet('off')};
function syncBoot(){
  syncLoad();syncBadge();if(SYNC.s)syncRun();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(200)});
  window.addEventListener('online',()=>syncSoon(200));
  setInterval(()=>{if(!document.hidden)syncSoon(0)},60e3);
}

// ═══ Boot ════════════════════════════════════════════════════════════════
load();applyTheme();syncLoad();route();syncBoot();
if('serviceWorker'in navigator&&location.protocol==='https:'&&!NATIVE)navigator.serviceWorker.register('sw.js').catch(()=>{});setTimeout(notifyToday,1500);

</script>
