<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mnemo — If you can't find it, you forgot it.</title>
<meta name="description" content="Mnemo — relational memory for dealmakers. Every meeting, call and encounter turned into actionable intelligence.">
<meta name="theme-color" content="#fbfbfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mnemo">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d1d1f'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23fff' stroke-width='2' opacity='.55'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23fff' stroke-width='1.5' opacity='.25'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfd;--surface:#fff;--fill:#f5f5f7;--fill2:#e8e8ed;
  --text:#1d1d1f;--text2:#5f5f64;--text3:#6e6e73;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);
  --accent:#0071e3;--accent-fill:#0071e3;--accent-soft:rgba(0,113,227,.1);--on-accent:#fff;
  --green:#1f7a35;--orange:#a84f0c;--red:#c4001a;
  --nav:rgba(251,251,253,.78);--shadow:0 12px 40px rgba(0,0,0,.12);
  --r:18px;--r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1c1c1e;--fill:#1c1c1e;--fill2:#2c2c2e;
  --text:#f5f5f7;--text2:#a8a8ad;--text3:#8e8e93;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --accent:#2997ff;--accent-fill:#0a6bd6;--accent-soft:rgba(41,151,255,.16);--on-accent:#fff;
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --nav:rgba(0,0,0,.72);--shadow:0 12px 40px rgba(0,0,0,.6);
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .sheet{background:#1c1c1e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ── Navigation ── */
#nav{position:fixed;inset:0 0 auto 0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;padding:0 max(20px,env(safe-area-inset-left));background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.02em;margin-inline-end:auto;flex:1}
.brand-btn{display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;padding:6px 8px;margin-inline-start:-8px;border-radius:10px;color:var(--text)}
.brand-btn:hover{background:var(--fill2)}
.brand i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text);position:relative;display:block}
.brand i::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--text)}
.tabs{display:flex;gap:2px}
.tab{padding:7px 14px;border-radius:99px;font-size:13.5px;color:var(--text2);transition:color .15s,background .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:var(--fill2);font-weight:500}
.nav-r{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--fill2);color:var(--text)}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;background:var(--fill2);color:var(--text2);font-size:13px;min-width:170px}
.search-btn kbd{margin-inline-start:auto;font:inherit;font-size:11px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:500;background:var(--fill2);color:var(--text);transition:filter .15s,transform .1s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--red);background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}

/* ── Layout ── */
#view{position:fixed;inset:52px 0 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{max-width:980px;margin:0 auto;padding:56px 24px 96px}
.hero{font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hero-sub{font-size:19px;color:var(--text2);margin-top:10px;letter-spacing:-.015em}
.section{margin-top:52px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-h h2{font-size:22px;font-weight:600;letter-spacing:-.025em}
.section-h span,.muted{color:var(--text2);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{padding:20px 22px}
.stat b{display:block;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text2)}
.rows>*{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.rows>*:last-child{border-bottom:0}
.rows>button:hover,.rows>.hov:hover{background:var(--fill)}
.rows>*:first-child{border-radius:var(--r) var(--r) 0 0}.rows>*:last-child{border-radius:0 0 var(--r) var(--r)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{display:block;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:13px;color:var(--text3);white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:0}
.av.lg{width:76px;height:76px;font-size:27px}
.av.sm{width:26px;height:26px;font-size:10.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--fill2);color:var(--text2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.chip.orange{background:color-mix(in srgb,var(--orange) 13%,transparent);color:var(--orange)}
.chip.red{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:grid;place-items:center;color:transparent;transition:all .15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.empty{padding:44px 24px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:16px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px;margin-bottom:28px;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--fill2);border-radius:10px;padding:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.input,.select,.textarea{width:100%;height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);outline:0;transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;min-height:110px;padding:11px 13px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field{display:block}
.field>span{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;display:grid;place-items:center;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}

/* ── People ── */
.people{display:grid;grid-template-columns:340px 1fr;height:100%}
.plist{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.plist-top{padding:18px 16px 10px;display:flex;flex-direction:column;gap:10px}
.plist-top h1{font-size:26px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;justify-content:space-between}
.plist-scroll{overflow-y:auto;flex:1;padding:0 8px 24px}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:start}
.prow:hover{background:var(--fill2)}
.prow.on{background:var(--accent-fill);color:#fff}
.prow.on .row-main span{color:rgba(255,255,255,.8)}
.prow.on .ring circle:first-child{stroke:rgba(255,255,255,.3)}.prow.on .ring circle:last-child{stroke:#fff}
.pdetail{overflow-y:auto;min-width:0}
.pd{max-width:760px;margin:0 auto;padding:44px 32px 96px}
.pd-head{display:flex;gap:22px;align-items:center}
.pd-head h1{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.pd-head p{color:var(--text2);font-size:17px;margin-top:4px}
.pd-actions{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.back{display:none}
.strength{display:flex;align-items:center;gap:18px;padding:18px 22px;margin-top:28px}
.strength .row-main b{font-size:17px;font-weight:600}
.strength .row-main span{white-space:normal}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv>div{padding:15px 20px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){border-inline-end:1px solid var(--line)}
.kv>div.full{grid-column:1/-1;border-inline-end:0}
.kv small{display:block;font-size:12px;color:var(--text2);margin-bottom:2px}
.kv p{font-size:15px;overflow-wrap:anywhere}
.tl{position:relative}
.tl-item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-ic{width:32px;height:32px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;color:var(--text2);flex-shrink:0}
.tl-body{flex:1;min-width:0}
.tl-body b{font-weight:500}
.tl-body time{font-size:12.5px;color:var(--text3);margin-inline-start:8px}
.tl-body p{color:var(--text2);font-size:14px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-body p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-more{font-size:13px;color:var(--accent);margin-top:4px}
.ask{display:flex;gap:8px;padding:8px;border-radius:99px;background:var(--fill2)}
.ask input{flex:1;background:none;border:0;outline:0;padding:0 12px;min-width:0}
.wk{padding:20px 22px}
.wk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wk-m b{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wk-m span{color:var(--text2);font-size:13px}.wk-m em{display:block;font-style:normal;font-size:12.5px;color:var(--text3);margin-top:2px}
.wk-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.wk-link{color:var(--accent);font:inherit;min-height:32px}
.wk-row h4{font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
@media(max-width:640px){.wk-grid{grid-template-columns:1fr 1fr}}
.answer{padding:18px 22px;margin-top:12px;white-space:pre-wrap;font-size:15px;line-height:1.55}
.addrow{display:flex;gap:10px;padding:10px 14px 10px 20px;align-items:center}
.addrow input{flex:1;border:0;outline:0;background:none;height:34px;min-width:0}
.addrow input[type=date]{flex:0 0 auto;color:var(--text2);font-size:13px}

/* ── Network ── */
.net{position:relative;height:100%;overflow:hidden;background:var(--bg)}
#net-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#net-canvas.grabbing{cursor:grabbing}#net-canvas.pointer{cursor:pointer}
.net-top{position:absolute;top:20px;inset-inline-start:24px;width:230px;pointer-events:none}
.net-tools{position:absolute;bottom:20px;inset-inline-start:24px;width:250px}
.net-top h1{font-size:30px;font-weight:700;letter-spacing:-.035em}
.net-top p{color:var(--text2);font-size:13.5px;margin-top:2px}
.net-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--text2);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.net-search input{flex:1;border:0;outline:0;background:none;min-width:0}
.net-ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.glass{background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line)}
.net-panel{position:absolute;top:20px;bottom:20px;inset-inline-end:20px;width:330px;border-radius:22px;overflow-y:auto;padding:22px;box-shadow:var(--shadow)}
.net-panel h3{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.net-panel h4{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px}
.net-panel .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:start}
.net-panel .line:last-child{border:0}
.net-panel .line span:last-child{color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.net-panel button.line:hover{color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--fill2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.net-zoom{position:absolute;bottom:20px;inset-inline-end:370px;display:flex;border-radius:99px;overflow:hidden}
.net-zoom button{width:38px;height:36px;display:grid;place-items:center;color:var(--text2);font-size:18px}
.net-zoom button:hover{background:var(--fill2);color:var(--text)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:13.5px;margin-top:8px}
.path b{font-weight:600}

/* ── Deals ── */
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--fill);border-radius:var(--r);padding:12px;min-height:300px;transition:background .15s,box-shadow .15s}
:root[data-theme="dark"] .col{background:#0d0d0f}
.col.over{box-shadow:inset 0 0 0 2px var(--accent)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 12px;font-size:13.5px;font-weight:600}
.col-h span{font-weight:400;color:var(--text2);font-size:12.5px;font-variant-numeric:tabular-nums}
.deal{display:block;width:100%;text-align:start;padding:13px 14px;margin-bottom:8px;border-radius:14px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.deal:hover{border-color:var(--line2)}
.deal b{display:block;font-weight:500;font-size:14px}
.deal span{display:block;font-size:12.5px;color:var(--text2);margin-top:1px}
.deal em{display:block;font-style:normal;font-size:15px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}

/* ── Sheets, palette, toast ── */
#scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#scrim.on{display:flex;animation:fade .18s ease}
.sheet{background:var(--surface);border-radius:24px;width:100%;max-width:520px;max-height:min(88vh,820px);overflow-y:auto;box-shadow:var(--shadow);animation:rise .26s cubic-bezier(.2,.9,.3,1)}
.sheet.wide{max-width:640px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 4px;position:sticky;top:0;background:inherit;z-index:1;border-radius:24px 24px 0 0}
.sheet-h h2{font-size:21px;font-weight:600;letter-spacing:-.025em}
.sheet-b{padding:14px 24px 24px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding-top:6px;flex-wrap:wrap}
.sheet-f .danger{margin-inline-end:auto}
.sheet h5{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.hint{font-size:13px;color:var(--text2);line-height:1.5}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{list-style:none;display:flex;gap:12px;font-size:14.5px}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex-shrink:0}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:28px;text-align:center;color:var(--text2);cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rec{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.rec-btn{width:84px;height:84px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;transition:transform .15s;box-shadow:0 8px 24px color-mix(in srgb,var(--red) 35%,transparent)}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn i{display:block;width:30px;height:30px;border-radius:50%;background:#fff;transition:all .2s}
.rec-btn.live i{width:26px;height:26px;border-radius:7px}
.rec-btn.live{animation:pulse 1.6s ease-in-out infinite}
.rec-time{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill2);border-top-color:var(--accent);animation:spin .7s linear infinite}
.pal{align-self:flex-start;margin-top:9vh;max-width:620px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 20px;height:58px;border-bottom:1px solid var(--line);color:var(--text2)}
.pal-in input{flex:1;border:0;outline:0;background:none;font-size:18px;min-width:0}
.pal-list{overflow-y:auto;padding:8px;max-height:56vh}
.pal-list h6{font-size:11.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px 4px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:9px 12px;border-radius:12px}
.pal-item.on{background:var(--accent-fill);color:#fff}
.pal-item.on span,.pal-item.on .tl-ic{color:rgba(255,255,255,.85)}
.pal-item.on .tl-ic{background:rgba(255,255,255,.2)}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);z-index:80;padding:11px 20px;border-radius:99px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sync-btn.busy{color:var(--accent);animation:blink 1.2s ease-in-out infinite}#sync-btn.err{color:var(--red)}
@keyframes blink{50%{opacity:.35}}
/* ── World map ── */
.mapv #map{position:absolute;inset:0;z-index:0}
.mapv #world{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.mapv #world.grabbing{cursor:grabbing}
.sea{fill:#d9e6f2}.land{fill:#fdfdfb;stroke:#bfccd9;stroke-width:.25;vector-effect:non-scaling-stroke}
:root[data-theme="dark"] .sea{fill:#0b0f14}:root[data-theme="dark"] .land{fill:#2a2c31;stroke:#3a3d44}
.pinx{cursor:pointer;outline:none}.pinx circle{fill:var(--accent-fill);stroke:#fff;stroke-width:2;transition:fill .15s}
.pinx text{fill:#fff;font-weight:600;font-size:12.5px;text-anchor:middle;pointer-events:none}
.pinx.on circle{fill:#0a3d91}.pinx:focus-visible circle{stroke:var(--accent);stroke-width:4}
:root[data-theme="dark"] .pinx circle{stroke:#1c1c1e}
.map-zoom{position:absolute;bottom:20px;inset-inline-start:24px;z-index:2;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.map-zoom button{width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--text)}
.map-zoom button+button{border-top:1px solid var(--line)}
.map-zoom button:hover{background:var(--fill2)}
.mapv .map-box{position:absolute;top:20px;inset-inline-start:24px;z-index:2;max-width:min(560px,calc(100% - 400px));padding:16px 18px;border-radius:20px;box-shadow:var(--shadow)}
.mapv .map-box h1{font-size:28px;font-weight:700;letter-spacing:-.03em}
.mapv .map-box p{color:var(--text2);font-size:13.5px;margin:2px 0 10px}
.mapv .net-panel{z-index:2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{height:30px;flex-shrink:0;cursor:pointer}
.pin{display:grid;place-items:center;border-radius:50%;background:var(--accent-fill);color:#fff;font-weight:600;font-size:12.5px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .15s}
.pin.on{transform:scale(1.18);background:#0a3d91}
:root[data-theme="dark"] .pin{border-color:#1c1c1e}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--text2);z-index:1;text-align:center;padding:24px}
@media (max-width:860px){.map-zoom{bottom:16px;inset-inline-start:12px}.mapv .map-box{inset-inline:12px;top:12px;max-width:none;padding:12px 14px}.mapv .map-box h1{font-size:22px}.mapv .map-box p{display:none}}
/* ── Last contact tiles, reminders ── */
.touch{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.touch button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:background .15s,transform .1s}
.touch button:hover{background:var(--fill)}
.touch button:active{transform:scale(.96)}
.touch b{font-size:13px;font-weight:600}
.touch span{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.touch svg{color:var(--accent)}
.presets{display:flex;gap:6px;padding:0 14px 12px 46px;flex-wrap:wrap}
.presets button{height:26px;padding:0 10px;border-radius:99px;background:var(--fill2);color:var(--text2);font-size:12.5px}
.presets button:hover{color:var(--text)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:#c4001a;color:#fff;font-size:10.5px;font-weight:600;margin-inline-start:6px;vertical-align:1px}
#tabbar .badge{position:absolute;top:5px;margin-inline-start:16px}
#tabbar button{position:relative}
#toast.on.act{pointer-events:auto}
#toast button{color:var(--accent);font-weight:600;margin-inline-start:14px}
@media (max-width:860px){
  .rows .btn .lbl{display:none}.rows .btn.sm{width:40px;padding:0}
  .pd .chip,.net-ctl .chip{height:34px!important}
  .hint a{display:inline-block;padding:8px 0}
  .btn.sm{height:36px}.chip,.chips .chip{height:34px}.seg button{min-height:34px}.presets button{height:34px}
  .check{position:relative}.check::after{content:"";position:absolute;inset:-11px}
  .rows .icon-btn,.addrow .icon-btn{width:36px!important;height:36px!important}
  .tl-more{display:inline-block;padding:8px 0}
  .touch{gap:6px}.touch button{padding:10px 2px;border-radius:14px}.touch b{font-size:11.5px}.touch span{font-size:10.5px}.presets{padding-inline-start:16px}}
.tell{display:flex;align-items:center;gap:10px;margin-top:28px;padding:8px 8px 8px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 6px 24px rgba(0,0,0,.05)}
.tell:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tell input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:38px}
.tell-ic{color:var(--accent)}
.pdeals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.pdeals .deal{margin:0;cursor:pointer}
#tabbar{display:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--red) 0%,transparent),0 8px 24px color-mix(in srgb,var(--red) 35%,transparent)}0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 30%,transparent),0 8px 24px color-mix(in srgb,var(--red) 35%,transparent)}}
.enter>*{animation:rise .45s cubic-bezier(.2,.9,.3,1) backwards}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  #nav .tabs,.search-btn span,.search-btn kbd{display:none}
  .search-btn{min-width:0;width:34px;padding:0;justify-content:center;background:none}
  #tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:30;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--text3)}
  #tabbar button.on{color:var(--accent)}
  #view{bottom:calc(58px + env(safe-area-inset-bottom))}
  .page{padding:32px 16px 48px}
  .stats{grid-template-columns:1fr 1fr}
  .people{grid-template-columns:1fr}
  .people.has-sel .plist,.people:not(.has-sel) .pdetail{display:none}
  .plist{border:0}
  .pd{padding:20px 16px 60px}
  .pd-head{gap:16px}.pd-head h1{font-size:27px}.av.lg{width:60px;height:60px;font-size:21px}
  .back{display:inline-flex;margin-bottom:14px;margin-inline-start:-10px}
  .map-link{display:none}
  .kv{grid-template-columns:1fr}.kv>div:nth-child(odd){border-inline-end:0}
  .grid2{grid-template-columns:1fr}
  .net-top{inset-inline:16px;width:auto;top:14px}
  .net-top h1{font-size:24px}.net-top p{display:none}
  .net-tools{inset-inline:16px;width:auto;top:54px;bottom:auto}
  .net-panel{top:auto;inset-inline:10px;bottom:10px;width:auto;max-height:46%;padding:18px}
  .net-zoom{display:none}
  #scrim{padding:0;align-items:flex-end}
  .sheet{max-width:none!important;border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom)}
  .pal{align-self:stretch;margin:0;height:100%;max-height:none;border-radius:0}
  .board{grid-template-columns:repeat(6,78vw)}
}
</style>
</head>
<body>
<header id="nav">
  <div class="brand"><button class="brand-btn" data-a="go" data-v="today" aria-label="Mnemo — Today"><i></i>Mnemo</button></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="nav-r">
    <button class="search-btn" data-a="palette" id="search-btn"></button>
    <button class="icon-btn" data-a="settings" id="sync-btn" hidden></button>
    <button class="btn primary sm" data-a="capture" id="capture-btn"></button>
    <button class="icon-btn" data-a="settings" id="settings-btn" aria-label="Settings"></button>
  </div>
</header>
<main id="view"></main>
<nav id="tabbar"></nav>
<div id="scrim"></div>
<div id="toast" role="status"></div>
<script>
'use strict';
// ═══ Mnemo 2 — state, storage, helpers ═══════════════════════════════════
// Storage keys are shared with the classic version so existing data carries over.
const LS={clients:'ncrm3_clients',deals:'ncrm3_deals',cfg:'ncrm3_cfg',theme:'ncrm3_theme',li:'mnemo_li',sync:'mnemo_sync'};
const MODEL={smart:'claude-sonnet-5-5',fast:'claude-haiku-5-5'};
// Inside the mobile app the page is not served by Netlify, so the functions are called by full address.
const NATIVE=!!window.Capacitor?.isNativePlatform?.(),API=NATIVE?'https://mnemo-crm.netlify.app':'';
const S={clients:[],deals:[],li:[],cfg:{lang:'en',ak:'',cur:'USD'},view:'today',sel:null,q:'',filter:'all',chip:'',year:''};
const STAGES=[['lead','Lead'],['qualified','Qualified'],['proposal','Proposal'],['negotiation','Negotiation'],['won','Won'],['lost','Lost']];
const KINDS={note:'Note',meeting:'Meeting',call:'Call',email:'Email',sms:'SMS',whatsapp:'WhatsApp',audio:'Voice note'};
const KIND_ALIAS={teams:'meeting',zoom:'meeting',gcal:'meeting',outlook:'email',gmail:'email',aircall:'call',slack:'note'};
const AV_COLORS=['#5856d6','#0062cc','#0e7383','#1f7a3a','#b25000','#c2185b','#8a3fb8','#7a5a3a'];

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const normCo=s=>norm(s).replace(/\b(llc|ltd|inc|sa|sas|plc|llp|group|groupe|holding|holdings|co|corp|fz|fze|dmcc)\b\.?/g,'').replace(/[^a-z0-9؀-ۿ]+/g,' ').trim();
const locale=()=>({ar:'ar-AE',fr:'fr-FR'}[S.cfg.lang]||'en-GB');
const fn=c=>{const f=(c.firstname||'').trim(),n=(c.name||'').trim();if(!f)return n;if(norm(n).startsWith(norm(f)))return n;return n===n.toUpperCase()&&n.length>1?f+' '+n[0]+n.slice(1).toLowerCase().replace(/([\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):f+' '+n};
const first=c=>(c.firstname||fn(c).split(' ')[0]||'').trim();
const ini=name=>name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const hash=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h};
const avColor=name=>AV_COLORS[hash(name)%AV_COLORS.length];
const av=(name,cls='')=>`<span class="av ${cls}" style="background:${avColor(name)}">${esc(ini(name))}</span>`;
const safeUrl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^\/+/,'');try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
const daysSince=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/864e5)):null;
const todayISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtDate=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString(locale(),{day:'numeric',month:'short',year:x.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};
const rel=d=>{const n=daysSince(d);if(n===null)return'';const r=new Intl.RelativeTimeFormat(locale(),{numeric:'auto'});if(n<1)return r.format(0,'day');if(n<14)return r.format(-n,'day');if(n<60)return r.format(-Math.round(n/7),'week');if(n<365)return r.format(-Math.round(n/30),'month');return r.format(-Math.round(n/365),'year')};
const money=v=>{v=Number(v)||0;const big=Math.abs(v)>=1e6;try{return new Intl.NumberFormat(locale(),{style:'currency',currency:S.cfg.cur||'USD',currencyDisplay:'narrowSymbol',maximumFractionDigits:big?1:0,notation:big?'compact':'standard'}).format(v)}catch(e){return String(v)}};
const person=id=>S.clients.find(c=>String(c.id)===String(id));

const ICON={
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14.9c1.6.8 2.7 2.4 3 5.1"/>',
  network:'<circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/>',
  deals:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.8 1.2V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 14H3a2 2 0 110-4h.1a1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 3V3a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 10h0a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/>',
  note:'<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/>',meeting:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/>',
  email:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  whatsapp:'<path d="M4 20l1.3-4.2A8 8 0 1112 20a8 8 0 01-3.8-1z"/>',sms:'<path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9.5h8M8 12.5h5"/>',audio:'<path d="M4 10v4M8 6v12M12 9v6M16 5v14M20 10v4"/>',
  in:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 10.5V16M8 7.8v.1M12 16v-5.5M12 13a2 2 0 014 0v3"/>',
  back:'<path d="M14 6l-6 6 6 6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',
  up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',cloud:'<path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 10.2 3.9 3.9 0 0117.5 18z"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  map:'<path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/>',
  gift:'<rect x="3.5" y="8.5" width="17" height="12" rx="2"/><path d="M3.5 12.5h17M12 8.5v12"/><path d="M12 8.5C10.6 5.6 7 5.2 7 7.2S10 8.5 12 8.5zm0 0c1.4-2.9 5-3.3 5-1.3S14 8.5 12 8.5z"/>',
  card:'<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.6 15.6c.6-1.3 1.6-2 2.9-2s2.3.7 2.9 2M14 10h4M14 13.5h3"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[n]||''}</svg>`;
const ring=(v,size=30,label=false)=>{const r=size/2-2.5,c=2*Math.PI*r;return`<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill2)" stroke-width="2.5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}"/></svg>${label?`<b style="font-size:${size>50?17:11}px">${v}</b>`:''}</span>`};

// ─── Relationship model ───
const events=c=>[
  ...(c.ints||[]).map(i=>({id:i.id,kind:KIND_ALIAS[i.src]||(KINDS[i.src]?i.src:'note'),title:i.title||'',date:i.date,text:i.tr||'',sum:i.sum||'',dur:i.dur||'',src:'ints'})),
  ...(c.meetings||[]).map(m=>({id:m.id,kind:m.type==='call'?'call':'meeting',title:m.title||'',date:m.date,text:[m.notes,m.transcript].filter(Boolean).join('\n\n'),sum:m.location||'',dur:m.duration?m.duration+' min':'',src:'meetings'}))
].filter(e=>e.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
// A planned meeting is not a conversation yet: only past events count as contact.
const isPast=e=>Date.parse(e.date)<=Date.now()+6e4;
const pastEvents=c=>events(c).filter(isPast);
const lastTouch=c=>pastEvents(c)[0]?.date||null;
function strength(c){
  const ev=pastEvents(c),d=daysSince(ev[0]?.date);
  const recency=d===null?0:55*Math.exp(-d/45);
  const freq=Math.min(30,9*Math.log2(1+ev.length));
  const deal=S.deals.some(x=>String(x.contactId)===String(c.id)&&!['won','lost'].includes(x.stage))?8:0;
  const depth=Math.min(7,(c.tasks||[]).filter(x=>!x.done).length*2+(c.project?2:0)+(c.followon?1:0));
  return Math.round(Math.min(100,recency+freq+deal+depth));
}
const circleOf=s=>s>=60?1:s>=30?2:3;
const CIRCLES=['','Inner circle','Active circle','Outer circle'];
const allTasks=()=>S.clients.flatMap(c=>(c.tasks||[]).map(x=>({c,x})));

// ─── Storage ───
function load(){
  try{Object.assign(S.cfg,JSON.parse(localStorage.getItem(LS.cfg)||'{}'))}catch(e){}
  if(!S.cfg.cur)S.cfg.cur='USD';
  const read=k=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:null}catch(e){return null}};
  const cl=read(LS.clients);
  if(cl&&cl.length){S.clients=cl;S.deals=read(LS.deals)||[];S.li=read(LS.li)||[]}
  else{const d=sampleData();S.clients=d.clients;S.deals=d.deals;S.li=d.li;save()}
  S.clients.forEach(c=>{c.ints=c.ints||[];c.tasks=c.tasks||[]});
}
function save(){
  try{
    localStorage.setItem(LS.clients,JSON.stringify(S.clients));
    localStorage.setItem(LS.deals,JSON.stringify(S.deals));
    localStorage.setItem(LS.li,JSON.stringify(S.li));
  }catch(e){toast(t('Storage is full — export a backup from Settings.'))}
}

function parseJSON(text){const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a<0||b<=a)return null;try{return JSON.parse(text.slice(a,b+1))}catch(e){return null}}
// Current Claude models think before answering, and thinking counts against max_tokens: keep effort low
// for quick extraction, leave room for the thinking, and treat a cut-off answer as a failure.
async function ai(prompt,{system,max=800,fast=false,effort}={}){
  const body={model:fast?MODEL.fast:MODEL.smart,max_tokens:Math.min(8000,max+3000),output_config:{effort:effort||(fast?'low':'medium')},messages:[{role:'user',content:prompt}]};
  if(system)body.system=system;
  const direct=!!S.cfg.ak,headers={'Content-Type':'application/json'};
  if(direct)Object.assign(headers,{'x-api-key':S.cfg.ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});else if(S.cfg.code)headers['X-Mnemo-Code']=S.cfg.code;
  const res=await fetch(direct?'https://api.anthropic.com/v1/messages':API+'/.netlify/functions/claude',{method:'POST',headers,body:JSON.stringify(body)});
  const d=await res.json().catch(()=>null);
  if(!res.ok||!d||d.error)throw Object.assign(new Error(d?.error?.message||'HTTP '+res.status),{code:d?.error?.code});
  const text=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  if(!text||d.stop_reason==='max_tokens'&&!/[}\].!?…]\s*$/.test(text))throw new Error(d.stop_reason==='refusal'?'The AI declined this request.':'The AI answer was cut off.');
  return text;
}

function dossier(c,limit=6000){
  const plans=events(c).filter(e=>!isPast(e)).map(e=>`- ${String(e.date).slice(0,16).replace('T',' ')} ${e.title}`).join('\n');
  const head=`${fn(c)} — ${c.role||''} @ ${c.company||''}\nProject: ${c.project||'-'} | Target: ${c.target||'-'} | Follow-on: ${c.followon||'-'} | Met: ${c.location||'-'} | Context: ${c.context||'-'}`;
  const ev=pastEvents(c).map(e=>`[${String(e.date).slice(0,10)} · ${e.kind}] ${e.title}\n${(e.text||e.sum).slice(0,1500)}`).join('\n\n');
  const tasks=(c.tasks||[]).filter(x=>!x.done).map(x=>`- ${x.title}${x.due?' (due '+x.due+')':''}`).join('\n');
  return(head+(plans?'\n\nPlanned (not happened yet):\n'+plans:'')+'\n\nOpen follow-ups:\n'+(tasks||'-')+'\n\nHistory (newest first):\n'+(ev||'-')).slice(0,limit);
}

const TABS=[['today','Today'],['people','People'],['network','Network'],['map','Map'],['deals','Deals']];
function nav(){
  const n=remindersDue(),bd=k=>k==='today'&&n?`<span class="badge" aria-label="${t('{n} reminders',{n})}">${n}</span>`:'';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-a="go" data-v="${k}">${t(l)}${bd(k)}</button>`).join('');
  $('#tabbar').innerHTML=TABS.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-a="go" data-v="${k}">${ic(k,22)}${t(l)}${bd(k)}</button>`).join('');
  $('#search-btn').innerHTML=`${ic('search',15)}<span>${t('Search or ask')}</span><kbd>${/Mac|iPhone|iPad/.test(navigator.platform)?'⌘K':'Ctrl K'}</kbd>`;
  $('#capture-btn').innerHTML=`${ic('plus',15)}${t('Capture')}`;
  $('#settings-btn').innerHTML=ic('gear');syncBadge();
  document.documentElement.lang=S.cfg.lang;document.documentElement.dir=S.cfg.lang==='ar'?'rtl':'ltr';
}
const go=(view,id)=>{const h='#'+view+(id?'/'+id:'');if(location.hash===h)route();else location.hash=h};
function route(){
  const[v,id]=location.hash.slice(1).split('/');
  S.view=V[v]?v:'today';
  if(S.view==='people')S.sel=id&&person(id)?person(id).id:null;
  render(true);
}
function render(fresh){
  const keep=fresh?null:[...document.querySelectorAll('.pdetail,.plist-scroll')].map(e=>e.scrollTop),top=$('#view').scrollTop;
  nav();
  if(S.view!=='network')netStop();
  if(S.view!=='map')mapStop();
  $('#view').innerHTML=V[S.view]();
  if(S.view==='network')netStart();
  if(S.view==='map')mapStart();
  if(keep){document.querySelectorAll('.pdetail,.plist-scroll').forEach((e,i)=>e.scrollTop=keep[i]||0);$('#view').scrollTop=top}else $('#view').scrollTop=0;
}
let toastT;
function toast(msg,act){const el=$('#toast');el.textContent=msg;el.classList.toggle('act',!!act);if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{el.classList.remove('on','act');act.run()};el.appendChild(b)}el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on','act'),act?5000:3200)}
function sheet(title,body,cls=''){
  $('#scrim').innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true"><div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-a="close" aria-label="Close">${ic('x')}</button></div><div class="sheet-b">${body}</div></div>`;
  $('#scrim').classList.add('on');
  setTimeout(()=>$('#scrim [autofocus]')?.focus(),60);
}
function closeSheet(){recAbort();$('#scrim').classList.remove('on');$('#scrim').innerHTML='';PAL.open=false}
A.close=closeSheet;
A.go=el=>go(el.dataset.v,el.dataset.id);
const sampleBanner=()=>hasSample()?`<div class="banner"><span>${t('You are exploring Mnemo with sample data.')}</span><button class="btn sm" data-a="li-import">${t('Import LinkedIn')}</button><button class="btn sm" data-a="clear-sample">${t('Start fresh')}</button></div>`:'';
A['clear-sample']=()=>{if(confirm(t('Remove all sample people, deals and connections?'))){clearSample();LIM=null;closeSheet();go('people')}};

// ─── Staying in touch: cadence, birthdays, the years you were in touch, groups ───
const CADENCES=[[0,'Never'],[14,'Every 2 weeks'],[30,'Every month'],[90,'Every quarter'],[180,'Every 6 months']];
const cadenceName=n=>t((CADENCES.find(x=>x[0]===+n)||CADENCES[0])[1]);
const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const isoDay=s=>/^\d{4}-\d\d-\d\d/.test(String(s||''))?String(s).slice(0,10):'';
const dayDiff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
// Days until the next reconnect is due (negative = overdue); null when no cadence is set.
function dueIn(c){
  if(!+c.cadence)return null;
  const last=isoDay(lastTouch(c));if(!last)return 0;
  const d=new Date(last+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+(+c.cadence));
  return dayDiff(d.toISOString().slice(0,10),todayISO());
}
const dueText=d=>d<0?t('Overdue by {n} days',{n:-d}):d===0?t('Due today'):t('Due in {n} days',{n:d});
function nextBirthday(c){
  const m=String(c.birthday||'').match(/^\d{4}-(\d\d)-(\d\d)$/);if(!m)return null;
  const today=todayISO(),y=+today.slice(0,4);
  for(const yy of[y,y+1]){const d=new Date(Date.UTC(yy,+m[1]-1,+m[2])).toISOString().slice(0,10);const n=dayDiff(d,today);if(n>=0)return n}
  return null;
}
const bdayLabel=s=>{const d=new Date(isoDay(s)+'T00:00:00Z');return isNaN(d)?'':d.toLocaleDateString(locale(),{day:'numeric',month:'long',timeZone:'UTC'})};
// The years a person was part of your life: when you met, and every conversation since.
function yearsOf(c){const y=new Set;const m=isoDay(c.metOn);if(m)y.add(m.slice(0,4));for(const e of events(c)){const d=isoDay(e.date);if(d)y.add(d.slice(0,4))}return y}
const allYears=()=>[...new Set(S.clients.flatMap(c=>[...yearsOf(c)]))].sort().reverse();
const groupsAll=()=>{const m=new Map;for(const c of S.clients){const g=String(c.group||'').trim();if(g)m.set(g,(m.get(g)||0)+1)}return[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
const inYear=c=>!S.year||yearsOf(c).has(S.year);
const CHANNELS=['call','email','sms','whatsapp','meeting'];
const lastBy=(c,k)=>pastEvents(c).find(e=>e.kind===k)?.date||null;
// What needs you today: follow-ups due, reconnects due, birthdays today.
function remindersDue(){const d=todayISO();let n=upcoming(1).filter(o=>isoDay(o.e.date)===d).length;for(const c of S.clients){for(const x of c.tasks||[])if(!x.done&&x.due&&x.due<=d)n++;const r=dueIn(c);if(r!==null&&r<=0)n++;if(nextBirthday(c)===0)n++}return n}
A.qlog=el=>{const c=person(el.dataset.id),k=el.dataset.k;if(!c||!KINDS[k])return;const it={id:uid(),title:t(KINDS[k]),date:nowLocal(),src:k,tr:'',sum:''};c.ints.push(it);save();render();
  toast(t('{k} logged',{k:t(KINDS[k])}),{label:t('Undo'),run:()=>{c.ints=c.ints.filter(x=>x!==it);save();render()}})};
A['due-preset']=el=>{const d=new Date();d.setDate(d.getDate()+(+el.dataset.d));const i=$('#task-due');if(i)i.value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);$('#task-in')?.focus()};
function upcoming(days){const end=Date.now()+days*864e5;return S.clients.flatMap(c=>events(c).filter(e=>!isPast(e)&&Date.parse(e.date)<=end).map(e=>({c,e}))).sort((a,b)=>Date.parse(a.e.date)-Date.parse(b.e.date))}
function whenLabel(d){const x=new Date(d),n=dayDiff(isoDay(d),todayISO()),tm=x.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'});return(n===0?t('Today'):n===1?t('Tomorrow'):x.toLocaleDateString(locale(),{weekday:'short',day:'numeric',month:'short'}))+' · '+tm}
A['brief-go']=el=>{const id=el.dataset.id;go('people',id);setTimeout(()=>{if($('#brief'))A.brief({dataset:{id}})},80)};
// ═══ Today ═══════════════════════════════════════════════════════════════
const dueChip=d=>{if(!d)return'';const n=Math.round((new Date(d)-new Date(todayISO()))/864e5);return`<span class="chip ${n<0?'red':n===0?'orange':''}">${n<0?t('Overdue'):n===0?t('Today'):fmtDate(d)}</span>`};
const taskRow=(c,x)=>`<div class="hov"><button class="check ${x.done?'on':''}" data-a="task-toggle" data-id="${c.id}" data-t="${x.id}" aria-label="${t('Done')}">${ic('check',13)}</button><button class="row-main" data-a="go" data-v="people" data-id="${c.id}" style="text-align:start"><b>${esc(x.title)}</b><span>${esc(fn(c))}${c.company?' · '+esc(c.company):''}</span></button>${dueChip(x.due)}</div>`;
// ── Your week: a rolling 7-day review (what happened, who drifted), with an optional AI write-up
function weekStats(off=0){
  const b=Date.now()-off*7*864e5,a=b-7*864e5,inW=d=>{const x=Date.parse(d);return x>a&&x<=b};
  const conv=S.clients.flatMap(c=>pastEvents(c).filter(e=>inW(e.date)).map(e=>({c,e})));
  const ppl=new Map();for(const o of conv)ppl.set(o.c,(ppl.get(o.c)||0)+1);
  const moved=S.deals.filter(d=>d.stageAt&&inW(d.stageAt));
  return{conv,ppl:[...ppl].sort((x,y)=>y[1]-x[1]),added:S.clients.filter(c=>c.createdAt&&inW(c.createdAt)),done:allTasks().filter(o=>o.x.done&&o.x.doneAt&&inW(o.x.doneAt)),moved,won:moved.filter(d=>d.stage==='won')};
}
// People you used to see often who have gone quiet for 4 to 10 weeks.
const cooling=()=>S.clients.filter(c=>c.status!=='inactive').map(c=>({c,d:daysSince(lastTouch(c)),n:pastEvents(c).length})).filter(o=>o.n>=3&&o.d>=28&&o.d<=70).sort((a,b)=>b.n-a.n).slice(0,4);
const WK='mnemo_week';
const weekNote=()=>{try{const v=JSON.parse(localStorage.getItem(WK)||'null');return v&&daysSince(v.at)<7?v:null}catch(e){return null}};
function weekCard(){
  const w=weekStats(),p=weekStats(1),cool=cooling(),note=weekNote(),diff=w.conv.length-p.conv.length;
  const m=(n,l,sub='')=>`<div class="wk-m"><b>${n}</b><span>${l}</span>${sub?`<em>${sub}</em>`:''}</div>`;
  const person=(c,txt)=>`<button class="chip" style="height:30px;padding-inline:4px 12px" data-a="go" data-v="people" data-id="${c.id}">${av(fn(c),'sm')}${esc(fn(c))}${txt?` · ${txt}`:''}</button>`;
  return`<section class="section"><div class="section-h"><h2>${t('Your week')}</h2><span>${t('Last 7 days')}</span></div>
    <div class="card wk">
      <div class="wk-grid">${m(w.conv.length,t('Conversations'),diff?`<span style="color:${diff>0?'var(--green)':'var(--orange)'}">${diff>0?'↑':'↓'} ${t('{n} vs last week',{n:Math.abs(diff)})}</span>`:p.conv.length?t('Same as last week'):'')}${m(w.ppl.length,t('People'),w.added.length?t('{n} new',{n:w.added.length}):'')}${m(w.done.length,t('Follow-ups done'))}${m(w.moved.length,t('Deals moved'),w.won.length?t('{v} won',{v:money(w.won.reduce((s,d)=>s+(+d.value||0),0))}):'')}</div>
      ${w.ppl.length?`<div class="wk-row"><h4>${t('Most time with')}</h4><div class="chips">${w.ppl.slice(0,5).map(([c,n])=>person(c,n>1?n:'')).join('')}</div></div>`:`<p class="hint wk-row">${t('No conversation logged this week yet.')}</p>`}
      ${cool.length?`<div class="wk-row"><h4>${t('Cooling down')}</h4><div class="chips">${cool.map(o=>person(o.c,t('{n} weeks',{n:Math.round(o.d/7)}))).join('')}</div></div>`:''}
      <div class="wk-row" id="wk-ai">${note?`<div class="answer" style="margin:0;padding:0">${esc(note.text)}</div><p class="hint" style="margin-top:8px">${t('Written {d}',{d:rel(note.at)})} · <button class="wk-link" data-a="week-ai">${t('Rewrite')}</button></p>`:`<button class="btn sm" data-a="week-ai">${ic('spark',14)}${t('Write my weekly review')}</button>`}</div>
    </div></section>`;
}
A['week-ai']=async()=>{
  const box=$('#wk-ai');if(box)box.innerHTML='<div class="spin"></div>';
  const w=weekStats(),cool=cooling(),soon=allTasks().filter(o=>!o.x.done&&o.x.due&&o.x.due<=new Date(Date.now()+7*864e5).toISOString().slice(0,10));
  const lines=[`Today: ${todayISO()}`,'Conversations in the last 7 days:',...w.conv.slice(0,60).map(o=>`- ${isoDay(o.e.date)} ${fn(o.c)}${o.c.company?' ('+o.c.company+')':''} · ${o.e.kind}: ${o.e.title}${o.e.sum?' — '+o.e.sum.slice(0,200):o.e.text?' — '+o.e.text.slice(0,200):''}`),
    'Follow-ups completed:',...w.done.map(o=>`- ${o.x.title} (${fn(o.c)})`),'Deals that changed stage:',...w.moved.map(d=>`- ${d.title}: now ${d.stage}, ${money(+d.value||0)}`),
    'Open follow-ups due in the next 7 days:',...soon.slice(0,20).map(o=>`- ${o.x.due} ${o.x.title} (${fn(o.c)})`),'Close relationships going quiet:',...cool.map(o=>`- ${fn(o.c)}: last spoke ${o.d} days ago`),
    'Upcoming meetings:',...upcoming(7).map(o=>`- ${isoDay(o.e.date)} ${o.e.title} with ${fn(o.c)}`)];
  try{const text=(await ai(`Write my weekly relationship review from these facts only. 3 to 5 short lines, each starting with "• ": what moved this week, who needs my attention next week and why, and one priority. Use names, be concrete, no filler. Plain text only: no markdown, no bold, no headings. If the week was empty, say so in one line and suggest who to reach out to. Write in ${aiLang()}.\n\n${lines.join('\n')}`,{max:600})).replace(/\*\*|__|^#+\s*/gm,'');
    try{localStorage.setItem(WK,JSON.stringify({at:new Date().toISOString(),text}))}catch(e){}render()}
  catch(e){aiFail(e);render()}
};
V.today=()=>{
  const h=new Date().getHours(),greet=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.';
  const open=allTasks().filter(o=>!o.x.done).sort((a,b)=>(a.x.due||'9999')<(b.x.due||'9999')?-1:1);
  const due=S.clients.map(c=>({c,due:dueIn(c)})).filter(o=>o.due!==null&&o.due<=3).sort((a,b)=>a.due-b.due);
  const quiet=S.clients.filter(c=>!+c.cadence&&c.status!=='inactive').map(c=>({c,d:daysSince(lastTouch(c)),n:events(c).length})).filter(o=>o.d!==null&&o.d>=21&&o.d<=240).sort((a,b)=>b.n-a.n||a.d-b.d);
  const reco=[...due.slice(0,8),...quiet].slice(0,Math.max(5,Math.min(8,due.length)));
  const bdays=S.clients.map(c=>({c,d:nextBirthday(c)})).filter(o=>o.d!==null&&o.d<=14).sort((a,b)=>a.d-b.d);
  const meets=upcoming(14);
  const recent=S.clients.flatMap(c=>pastEvents(c).map(e=>({c,e}))).sort((a,b)=>new Date(b.e.date)-new Date(a.e.date)).slice(0,6);
  const st=S.clients.map(strength),month=S.clients.flatMap(events).filter(e=>daysSince(e.date)<=30).length;
  const pipe=S.deals.filter(d=>!['won','lost'].includes(d.stage)).reduce((s,d)=>s+(+d.value||0),0);
  return`<div class="page enter">
    <div>${sampleBanner()}<h1 class="hero">${t(greet)}</h1><p class="hero-sub">${new Date().toLocaleDateString(locale(),{weekday:'long',day:'numeric',month:'long'})}</p>
      <form class="tell" onsubmit="return false"><span class="tell-ic">${ic('spark',18)}</span><input id="tell-in" aria-label="${t('Tell Mnemo what happened')}" placeholder="${t('Tell Mnemo what happened — e.g. Coffee with Omar, he wants the downside case by Friday')}" data-enter="tell" autocomplete="off"><button class="btn primary sm" data-a="tell">${t('File it')}</button></form></div>
    <div class="stats">
      <button class="card stat" data-a="go" data-v="people" style="text-align:start"><b>${S.clients.length}</b><span>${t('People')}</span></button>
      <button class="card stat" data-a="go" data-v="network" style="text-align:start"><b>${st.filter(s=>s>=60).length}</b><span>${t('Inner circle')}</span></button>
      <button class="card stat" data-a="go" data-v="deals" style="text-align:start"><b>${money(pipe)}</b><span>${t('Open pipeline')}</span></button>
      <div class="card stat"><b>${month}</b><span>${t('Conversations, last 30 days')}</span></div>
    </div>
    ${weekCard()}
    <section class="section"><div class="section-h"><h2>${t('Follow-ups')}</h2><span>${open.length||''}</span></div>
      <div class="card rows">${open.length?open.slice(0,7).map(o=>taskRow(o.c,o.x)).join(''):`<div class="empty" style="display:block"><b>${t('All clear.')}</b>${t('Nothing is waiting on you.')}</div>`}</div></section>
    ${meets.length||bdays.length?`<section class="section"><div class="section-h"><h2>${t('Coming up')}</h2></div>
      <div class="card rows">${meets.map(o=>`<div class="hov"><span class="tl-ic">${ic(o.e.kind,16)}</span><button class="row-main" data-a="go" data-v="people" data-id="${o.c.id}" style="text-align:start"><b>${esc(o.e.title||t(KINDS[o.e.kind]))} · ${esc(fn(o.c))}</b><span>${esc(whenLabel(o.e.date))}</span></button><button class="btn sm" data-a="brief-go" data-id="${o.c.id}" aria-label="${t('Brief me')}">${ic('spark',14)}<span class="lbl">${t('Brief me')}</span></button></div>`).join('')}${bdays.map(o=>`<div class="hov"><span class="tl-ic">${ic('gift',16)}</span><button class="row-main" data-a="go" data-v="people" data-id="${o.c.id}" style="text-align:start"><b>${esc(fn(o.c))}</b><span>${o.d===0?t('Birthday today'):t('Birthday in {n} days',{n:o.d})} · ${esc(bdayLabel(o.c.birthday))}</span></button><button class="btn sm" data-a="draft" data-id="${o.c.id}" data-why="birthday" aria-label="${t('Write a birthday message')}">${ic('spark',14)}<span class="lbl">${t('Write a birthday message')}</span></button></div>`).join('')}</div></section>`:''}
    ${reco.length?`<section class="section"><div class="section-h"><h2>${t('Reconnect')}</h2><span>${t('Relationships worth a nudge')}</span></div>
      <div class="card rows">${reco.map(o=>`<div class="hov">${av(fn(o.c))}<button class="row-main" data-a="go" data-v="people" data-id="${o.c.id}" style="text-align:start"><b>${esc(fn(o.c))}</b><span>${o.due!==undefined?`<span style="color:${o.due<0?'var(--red)':'var(--orange)'}">${dueText(o.due)}</span> · ${cadenceName(o.c.cadence)}`:t('Last spoke')+' '+rel(lastTouch(o.c))}${o.c.company?' · '+esc(o.c.company):''}</span></button><button class="btn sm" data-a="draft" data-id="${o.c.id}" aria-label="${t('Draft a message')}">${ic('spark',14)}<span class="lbl">${t('Draft a message')}</span></button><button class="icon-btn" data-a="touched" data-id="${o.c.id}" aria-label="${t('Mark as contacted')}" title="${t('Mark as contacted')}">${ic('check',16)}</button></div>`).join('')}</div></section>`:''}
    <section class="section"><div class="section-h"><h2>${t('Recent memory')}</h2></div>
      <div class="card rows">${recent.length?recent.map(o=>`<button data-a="go" data-v="people" data-id="${o.c.id}"><span class="tl-ic">${ic(o.e.kind,16)}</span><span class="row-main"><b>${esc(o.e.title||t(KINDS[o.e.kind]))}</b><span>${esc(fn(o.c))}${o.e.sum?' — '+esc(o.e.sum):''}</span></span><span class="row-meta">${rel(o.e.date)}</span></button>`).join(''):`<div class="empty" style="display:block"><b>${t('No memories yet.')}</b>${t('Record your first conversation.')}<br><button class="btn primary" data-a="capture">${t('Capture')}</button></div>`}</div></section>
  </div>`;
};

A.touched=el=>{const c=person(el.dataset.id);if(!c)return;c.ints.push({id:uid(),title:t('Reached out'),date:nowLocal(),src:'note',tr:'',sum:''});save();render();toast(+c.cadence?t('Logged. Next reminder in {n} days.',{n:+c.cadence}):t('Logged.'))};
// ═══ People ══════════════════════════════════════════════════════════════
function peopleList(){
  const q=norm(S.q);
  return S.clients.map(c=>({c,s:strength(c),last:lastTouch(c)}))
    .filter(o=>S.filter==='all'||circleOf(o.s)===+S.filter)
    .filter(o=>!S.chip||(S.chip==='#due'?(dueIn(o.c)!==null&&dueIn(o.c)<=0):String(o.c.group||'').trim()===S.chip))
    .filter(o=>inYear(o.c))
    .filter(o=>!q||norm([fn(o.c),o.c.company,o.c.role,o.c.project,o.c.group,o.c.city,o.c.location,(o.c.tags||[]).join(' ')].join(' ')).includes(q))
    .sort((a,b)=>b.s-a.s||fn(a.c).localeCompare(fn(b.c)));
}
const plistRows=list=>list.length?list.map(o=>`<button class="prow ${String(S.sel)===String(o.c.id)?'on':''}" data-a="go" data-v="people" data-id="${o.c.id}">${av(fn(o.c))}<span class="row-main"><b>${esc(fn(o.c))}</b><span>${esc([o.c.role,o.c.company].filter(Boolean).join(' · ')||'—')}</span></span>${ring(o.s,26)}</button>`).join(''):`<div class="empty">${t('No one found.')}</div>`;
V.people=()=>{
  const list=peopleList();
  if(!S.sel&&innerWidth>860&&list.length)S.sel=list[0].c.id;
  const c=S.sel&&person(S.sel);
  return`<div class="people ${c?'has-sel':''}">
    <aside class="plist"><div class="plist-top">
      <h1>${t('People')}<button class="icon-btn" data-a="new-person" aria-label="${t('New person')}">${ic('plus')}</button></h1>
      <input class="input" style="border-radius:99px;background:var(--fill2);border-color:transparent" placeholder="${t('Search')}" aria-label="${t('Search')}" value="${esc(S.q)}" data-i="pq">
      <div class="seg" style="align-self:flex-start">${[['all','All'],['1','Inner'],['2','Active'],['3','Outer']].map(([k,l])=>`<button class="${S.filter===k?'on':''}" data-a="pfilter" data-f="${k}">${t(l)}</button>`).join('')}</div>

function localSearch(q,list){
  const words=norm(q).split(/\s+/).filter(w=>w.length>2),out=[];
  for(const c of list)for(const e of events(c)){const hay=norm(e.title+' '+e.text+' '+e.sum),score=words.filter(w=>hay.includes(w)).length;if(score)out.push({c,e,score})}
  return out.sort((a,b)=>b.score-a.score||new Date(b.e.date)-new Date(a.e.date));
}
A.ask=async el=>{
  const c=person(el.dataset.id),q=$('#ask-in').value.trim(),out=$('#ask-out');if(!q)return;

  catch(e){const hits=localSearch(q,[c]).slice(0,4);out.innerHTML=`<div class="card answer"><span class="muted">${t('AI is offline — closest matches in your notes:')}</span>\n\n${hits.length?hits.map(h=>`${fmtDate(h.e.date)} — ${esc(h.e.title)}\n${esc((h.e.text||h.e.sum).slice(0,300))}`).join('\n\n'):t('Nothing found.')}</div>`}

function sent(kind){

function recSegment(){
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m)),idx=REC.n++,chunks=[];
  const mr=new MediaRecorder(REC.stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:32000});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.done=new Promise(res=>mr.onstop=()=>{REC.blobs[idx]=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});res()});
  mr.start();REC.mr=mr;
}
A['rec-start']=async()=>{REC.when='';
  if(!CAP.pid){toast(t('Choose who this is about first.'));return}
  if(!navigator.mediaDevices||!window.MediaRecorder){CAP.state='error';CAP.msg=t('This browser cannot record audio.');return capture()}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){CAP.state='error';CAP.msg=t('Microphone access was refused. Allow it in your browser settings.');return capture()}
  REC.blobs=[];REC.n=0;REC.secs=0;REC.pending=[];recSegment();
  REC.tick=setInterval(()=>{REC.secs++;const el=$('#rec-time');if(el)el.textContent=mmss(REC.secs)},1000);
  // Long meetings are cut into 8-minute segments so each upload stays under the serverless body limit.
  REC.rot=setInterval(()=>{const old=REC.mr;REC.pending.push(old.done);recSegment();old.stop()},8*60e3);
  CAP.state='live';capture();
};
function recHalt(){clearInterval(REC.tick);clearInterval(REC.rot);REC.stream?.getTracks().forEach(x=>x.stop());REC.stream=null}
function recAbort(){if(CAP.state==='live'){try{REC.mr.onstop=null;REC.mr.stop()}catch(e){}recHalt();CAP.state='idle'}}
A['rec-stop']=async()=>{const mr=REC.mr;clearInterval(REC.tick);clearInterval(REC.rot);mr.stop();await Promise.all([...REC.pending,mr.done]);recHalt();recProcess()};

// Imported audio. Whisper takes ogg, m4a, mp3, wav and webm up to the upload limit; anything
// longer or in another format is decoded on the device and sent as 100-second WAV pieces.
const UP_MAX=4*1024*1024,WHISPER_TYPES=['audio/ogg','audio/mp4','audio/mpeg','audio/wav','audio/webm'];
function audioType(file){const ext=String(file.name||'').toLowerCase().split('.').pop();return{opus:'audio/ogg',ogg:'audio/ogg',oga:'audio/ogg',m4a:'audio/mp4',mp4:'audio/mp4',mp3:'audio/mpeg',mpeg:'audio/mpeg',wav:'audio/wav',webm:'audio/webm'}[ext]||({'audio/x-m4a':'audio/mp4','audio/x-wav':'audio/wav','audio/opus':'audio/ogg','audio/mp3':'audio/mpeg'}[file.type])||file.type||''}
function audioSecs(blob){return new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(blob);a.preload='metadata';a.onloadedmetadata=()=>{URL.revokeObjectURL(u);res(isFinite(a.duration)?Math.round(a.duration):0)};a.onerror=()=>{URL.revokeObjectURL(u);res(0)};a.src=u})}
function wav16(s,rate){const b=new ArrayBuffer(44+s.length*2),v=new DataView(b),w=(o,x)=>{for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+s.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,s.length*2,true);
  for(let i=0;i<s.length;i++){const x=Math.max(-1,Math.min(1,s[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}return new Blob([b],{type:'audio/wav'})}
async function audioParts(file){
  const type=audioType(file);
  if(file.size<=UP_MAX&&WHISPER_TYPES.includes(type)){const blob=new Blob([file],{type});return{parts:[blob],secs:await audioSecs(blob)}}
  const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();let au;
  try{au=await ac.decodeAudioData(await file.arrayBuffer())}finally{try{ac.close()}catch(e){}}
  const rate=16000,off=new OfflineAudioContext(1,Math.max(1,Math.ceil(au.duration*rate)),rate),src=off.createBufferSource();src.buffer=au;src.connect(off.destination);src.start();
  const pcm=(await off.startRendering()).getChannelData(0),parts=[];
  for(let i=0;i<pcm.length;i+=rate*100)parts.push(wav16(pcm.subarray(i,Math.min(pcm.length,i+rate*100)),rate));
  return{parts,secs:Math.round(au.duration)};
}

async function transcribe(blob){
  const audioBase64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
  const res=await fetch(API+'/.netlify/functions/whisper',{method:'POST',headers:{'Content-Type':'application/json',...(S.cfg.code?{'X-Mnemo-Code':S.cfg.code}:{})},body:JSON.stringify({audioBase64,mimeType:blob.type.split(';')[0]||'audio/webm',language:S.cfg.lang})});
  const d=await res.json().catch(()=>null);
  if(!res.ok||!d||d.error)throw Object.assign(new Error(d?.error?.message||'HTTP '+res.status),{code:d?.error?.code});
  return d.text||'';
}
async function recProcess(){
  const c=person(CAP.pid),parts=REC.blobs.filter(Boolean);
  CAP.code=false;CAP.state='busy';CAP.msg=t('Transcribing…');capture();
  let tr='';

  if(!tr.trim()){CAP.state='error';CAP.msg=t('Nothing was heard. Try again closer to the microphone.');return capture()}
  CAP.msg=t('Understanding…');capture();
  const known=S.clients.filter(x=>x!==c).sort((a,b)=>strength(b)-strength(a)).slice(0,150);
  let r=null;
  try{r=parseJSON(await ai(`You are the memory of a dealmaker's CRM. This is a voice note or meeting recording about ${c?fn(c):'a contact'}${c?.company?' ('+c.company+')':''}. Return ONLY JSON: {"title":"max 6 words","summary":"max 2 sentences: the facts that matter for the deal and the relationship","tasks":[{"title":"concrete next action","due":"YYYY-MM-DD or empty"}],"people":["names copied exactly from KNOWN PEOPLE who are mentioned in the transcript, never the person the note is about"]}. Today is ${todayISO()}. Write values in ${aiLang()}.\n\nKNOWN PEOPLE:\n${known.map(x=>fn(x)+(x.company?' ('+x.company+')':'')).join('\n')||'-'}\n\nTranscript:\n${tr.slice(0,24000)}`,{max:700,fast:true}))}catch(e){console.warn(e)}

A.palette=()=>{PAL.open=true;$('#scrim').innerHTML=`<div class="sheet pal"><div class="pal-in">${ic('search',20)}<input id="pal-q" aria-label="${t('Search people and memories, or ask a question')}" placeholder="${t('Search people and memories, or ask a question')}" data-i="pal" autocomplete="off"><button class="icon-btn" data-a="close" aria-label="Close">${ic('x')}</button></div><div class="pal-list" id="pal-list"></div></div>`;$('#scrim').classList.add('on');I.pal($('#pal-q'));$('#pal-q').focus()};
const mark=(text,q)=>{const s=esc(text),w=q.trim().split(/\s+/).filter(x=>x.length>1).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return w.length?s.replace(new RegExp('('+w.join('|')+')','gi'),'<mark>$1</mark>'):s};
function snippet(text,q){const i=norm(text).indexOf(norm(q).split(/\s+/)[0]);const a=Math.max(0,i-40);return(a>0?'…':'')+text.slice(a,a+140)}
I.pal=el=>{
  const q=el.value.trim(),nq=norm(q),it=[];
  const acts=[['New person','plus',()=>A['new-person']()],['Record a voice note','mic',()=>A.capture({dataset:{tab:'voice'}})],['Add a note','note',()=>A.capture({dataset:{tab:'note'}})],['Open the relationship map','network',()=>{closeSheet();go('network')}],['Import LinkedIn connections','in',()=>A['li-import']()],['Import phone contacts','call',()=>A['ab-import']()],['Find duplicates','people',()=>A.dups()],['Scan a business card','card',()=>A.capture({dataset:{tab:'card'}})],['Open the world map','map',()=>{closeSheet();go('map')}],['Settings','gear',()=>A.settings()]];
  if(!nq){
    S.clients.map(c=>({c,d:lastTouch(c)||''})).sort((a,b)=>a.d<b.d?1:-1).slice(0,5).forEach(o=>it.push({h:'Recent',av:fn(o.c),title:esc(fn(o.c)),sub:esc(o.c.company||''),run:()=>{closeSheet();go('people',o.c.id)}}));
    acts.forEach(a=>it.push({h:'Actions',icon:a[1],title:t(a[0]),run:a[2]}));
  }else{
    S.clients.filter(c=>norm([fn(c),c.company,c.role,c.project].join(' ')).includes(nq)).slice(0,6).forEach(c=>it.push({h:'People',av:fn(c),title:mark(fn(c),q),sub:mark([c.role,c.company].filter(Boolean).join(' · '),q),run:()=>{closeSheet();go('people',c.id)}}));
    localSearch(q,S.clients).slice(0,7).forEach(o=>it.push({h:'Memory',icon:o.e.kind,title:mark(o.e.title||t(KINDS[o.e.kind]),q),sub:esc(fn(o.c))+' — '+mark(snippet(o.e.text||o.e.sum,q),q),run:()=>{closeSheet();go('people',o.c.id)}}));
    S.li.filter(x=>!liInCrm(x)&&norm(x.f+' '+x.l+' '+x.co).includes(nq)).slice(0,4).forEach(x=>it.push({h:isAb(x)?'Contacts':'LinkedIn',icon:isAb(x)?'call':'in',title:mark((x.f+' '+x.l).trim(),q),sub:mark([x.pos,x.co].filter(Boolean).join(' · '),q),run:()=>{closeSheet();NET.sel='l'+S.li.indexOf(x);NET.grp=null;go('network')}}));
    acts.filter(a=>norm(t(a[0])).includes(nq)).forEach(a=>it.push({h:'Actions',icon:a[1],title:t(a[0]),run:a[2]}));
    it.push({h:'Ask Mnemo',icon:'spark',title:esc(q),sub:t('Answer from everything you have recorded'),run:()=>askAll(q)});
  }
  PAL.items=it;PAL.idx=0;palDraw();
};
function palDraw(){let h='';$('#pal-list').innerHTML=PAL.items.map((x,i)=>`${x.h!==h?`<h6>${t(h=x.h)}</h6>`:''}<button class="pal-item ${i===PAL.idx?'on':''}" data-a="pal-run" data-n="${i}">${x.av?av(x.av,'sm'):`<span class="tl-ic" style="width:26px;height:26px">${ic(x.icon,14)}</span>`}<span class="row-main"><b>${x.title}</b>${x.sub?`<span>${x.sub}</span>`:''}</span></button>`).join('');$('#pal-list .on')?.scrollIntoView({block:'nearest'})}
A['pal-run']=el=>PAL.items[+el.dataset.n]?.run();
async function askAll(q){
  const list=$('#pal-list');list.innerHTML='<div class="rec" style="padding:36px"><div class="spin"></div></div>';
  const hits=localSearch(q,S.clients).slice(0,30);
  const roster=S.clients.map(c=>`${fn(c)} | ${c.role||''} | ${c.company||''} | project: ${c.project||'-'} | target: ${c.target||'-'} | next: ${c.followon||'-'} | last contact: ${String(lastTouch(c)||'never').slice(0,10)} | strength ${strength(c)}/100${c.group?' | group: '+c.group:''}${c.city||c.location?' | place: '+(c.city||c.location):''}${yearsOf(c).size?' | years: '+[...yearsOf(c)].sort().join(', '):''}${linksOf(c).size?' | knows: '+[...linksOf(c).keys()].slice(0,10).map(id=>person(id)).filter(Boolean).map(fn).join(', '):''}`).join('\n');
  const mem=(hits.length?hits:S.clients.flatMap(c=>events(c).slice(0,2).map(e=>({c,e})))).slice(0,30).map(o=>`[${String(o.e.date).slice(0,10)} · ${fn(o.c)} · ${o.e.kind}] ${o.e.title}\n${(o.e.text||o.e.sum).slice(0,1200)}`).join('\n\n');
  try{const a=await ai(`You are Mnemo, the relational memory of a dealmaker. Answer the question using only the data below. Be direct and brief, name the people and dates. If the data does not say, say so. Answer in ${aiLang()}.\n\nQuestion: ${q}\n\nPEOPLE\n${roster.slice(0,20000)}\n\nMEMORIES\n${mem.slice(0,40000)}`,{max:700});if(PAL.open)list.innerHTML=`<div class="answer">${esc(a)}</div>`}
  catch(e){if(PAL.open){aiFail(e);I.pal($('#pal-q'))}}
}

// Deals the light Salesforce way: a probability per stage (editable per deal), a weighted pipeline,
// and how long a deal has sat in its stage — anything idle for more than 30 days is flagged.
const STAGE_P={lead:10,qualified:25,proposal:50,negotiation:75,won:100,lost:0};
const dealP=d=>d.prob!==undefined&&d.prob!==''&&!['won','lost'].includes(d.stage)?Math.max(0,Math.min(100,+d.prob)):STAGE_P[d.stage]??0;
const weighted=l=>l.reduce((s,d)=>s+(+d.value||0)*dealP(d)/100,0);
const inStage=d=>daysSince(d.stageAt||d.createdAt)??0;
const closeLate=d=>d.closeDate&&!['won','lost'].includes(d.stage)&&d.closeDate<todayISO();
function setStage(d,s){if(d.stage!==s){d.stage=s;d.stageAt=new Date().toISOString()}}
function dealCard(d,showPerson=true){const c=person(d.contactId),k=d.stage,stg=t((STAGES.find(s=>s[0]===k)||['',''])[1]),open=!['won','lost'].includes(k),age=inStage(d),stuck=open&&age>30;
  return`<button class="card deal" draggable="true" data-a="deal-edit" data-id="${d.id}"><b>${esc(d.title)}</b>${showPerson?`<span>${esc(c?fn(c):d.contactName||'')}</span>`:`<span class="chip ${k==='won'?'green':k==='lost'?'':'accent'}" style="height:22px;align-self:flex-start;margin-top:6px">${stg}</span>`}<em>${money(d.value)}</em>${open?`<span>${dealP(d)}% · ${money((+d.value||0)*dealP(d)/100)} ${t('weighted')}</span>`:''}${open?`<span style="${stuck?'color:var(--orange);font-weight:500':''}">${t('{n} days in stage',{n:age})}${closeLate(d)?` · <span style="color:var(--red)">${t('Close date passed')}</span>`:d.closeDate?' · '+t('Close')+' '+fmtDate(d.closeDate):''}</span>`:''}</button>`}
V.deals=()=>{
  const open=S.deals.filter(d=>!['won','lost'].includes(d.stage)),sum=l=>l.reduce((s,d)=>s+(+d.value||0),0);
  return`<div class="page enter" style="max-width:1400px"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h1 class="hero">${t('Deals')}</h1><p class="hero-sub">${money(sum(open))} ${t('in play')} · ${money(weighted(open))} ${t('weighted')} · ${money(sum(S.deals.filter(d=>d.stage==='won')))} ${t('won')}</p></div><button class="btn primary" data-a="deal-edit">${ic('plus',15)}${t('New deal')}</button></div>
    <div class="section"><div class="board">${STAGES.map(([k,l])=>{const ds=S.deals.filter(d=>d.stage===k);return`<div class="col" data-stage="${k}"><div class="col-h">${t(l)}<span>${ds.length?`${ds.length} · ${money(sum(ds))}`:''}</span></div>${ds.sort((a,b)=>inStage(b)-inStage(a)).map(d=>dealCard(d)).join('')}</div>`}).join('')}</div></div></div>`;
};
A['deal-edit']=el=>{
  const d=S.deals.find(x=>String(x.id)===el.dataset.id)||{stage:'lead',contactId:el.dataset.pid||(S.view==='people'?S.sel:'')};
  sheet(d.id?t('Deal'):t('New deal'),`<label class="field"><span>${t('Title')}</span><input class="input" id="d-title" value="${esc(d.title||'')}" autofocus></label>

};
A['deal-save']=el=>{
  const title=$('#d-title').value.trim();if(!title){toast(t('A title is required.'));return}
  const c=person($('#d-c').value),pr=$('#d-prob').value.trim(),v={title,contactId:c?c.id:'',contactName:c?fn(c):'',value:Math.max(0,+$('#d-val').value||0),closeDate:$('#d-close').value,notes:$('#d-notes').value.trim(),prob:pr===''?'':Math.max(0,Math.min(100,Math.round(+pr)||0))};
  const st=$('#d-stage').value,d=S.deals.find(x=>String(x.id)===el.dataset.id);
  if(d){Object.assign(d,v);setStage(d,st)}else S.deals.push({id:uid(),createdAt:new Date().toISOString(),stageAt:new Date().toISOString(),stage:st,...v});
  save();closeSheet();render();
};
A['deal-del']=el=>{if(!confirm(t('Delete this deal?')))return;S.deals=S.deals.filter(x=>String(x.id)!==el.dataset.id);save();closeSheet();render()};
let dragId=null;

let GEO={};try{GEO=JSON.parse(localStorage.getItem('mnemo_geo')||'{}')}catch(e){}
function placeOf(c){
  const raw=String(c.city||c.location||'').trim();if(!raw)return null;
  const k=gazKey(raw);let best=null,at=1e9;
  for(const[a,g]of GAZI){const i=k.indexOf(a);if(i>=0&&i<at){at=i;best=g}}
  if(best)return best;
  const q=(c.city||raw.split(/[—–|·,/(]| - /)[0]).trim();if(q.length<2)return null;
  const hit=GEO[q.toLowerCase()];
  if(hit)return{key:'q:'+hit[2],name:hit[2],lat:hit[0],lng:hit[1]};
  if(hit===undefined)geoAsk(q);
  return null;
}
// OpenStreetMap's Nominatim allows one request per second; results are kept on the device.
const GEOQ=[];let geoBusy=false,geoLeft=30;

async function geoPump(){
  if(geoBusy||!GEOQ.length)return;geoBusy=true;
  const q=GEOQ.shift();geoLeft--;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)+'&accept-language='+S.cfg.lang);const d=await r.json();
    GEO[q]=d&&d[0]?[+d[0].lat,+d[0].lon,String(d[0].display_name||q).split(',')[0].trim()]:0;try{localStorage.setItem('mnemo_geo',JSON.stringify(GEO))}catch(e){}

  setTimeout(()=>{geoBusy=false;geoPump()},1100);
}
