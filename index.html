<style>
:root{
  --bg:#fbfbfd;--surface:#fff;--fill:#f5f5f7;--fill2:#e8e8ed;
  --text:#1d1d1f;--text2:#5f5f64;--text3:#6e6e73;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);
  --accent:#0071e3;--accent-fill:#0071e3;--accent-soft:rgba(0,113,227,.1);--on-accent:#fff;
  --green:#1f7a35;--orange:#a84f0c;--red:#c4001a;
  --nav:rgba(251,251,253,.78);--shadow:0 12px 40px rgba(0,0,0,.12);
  --r:18px;--r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1c1c1e;--fill:#1c1c1e;--fill2:#2c2c2e;
  --text:#f5f5f7;--text2:#a8a8ad;--text3:#8e8e93;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --accent:#2997ff;--accent-fill:#0a6bd6;--accent-soft:rgba(41,151,255,.16);--on-accent:#fff;
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --nav:rgba(0,0,0,.72);--shadow:0 12px 40px rgba(0,0,0,.6);
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .sheet{background:#1c1c1e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ── Navigation ── */
#nav{position:fixed;inset:0 0 auto 0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;padding:0 max(20px,env(safe-area-inset-left));background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.02em;margin-inline-end:auto;flex:1}
.brand-btn{display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;padding:6px 8px;margin-inline-start:-8px;border-radius:10px;color:var(--text)}
.brand-btn:hover{background:var(--fill2)}
.brand i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text);position:relative;display:block}
.brand i::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--text)}
.tabs{display:flex;gap:2px}
.tab{padding:7px 14px;border-radius:99px;font-size:13.5px;color:var(--text2);transition:color .15s,background .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:var(--fill2);font-weight:500}
.nav-r{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--fill2);color:var(--text)}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;background:var(--fill2);color:var(--text2);font-size:13px;min-width:170px}
.search-btn kbd{margin-inline-start:auto;font:inherit;font-size:11px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:500;background:var(--fill2);color:var(--text);transition:filter .15s,transform .1s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--red);background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}

/* ── Layout ── */
#view{position:fixed;inset:52px 0 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{max-width:980px;margin:0 auto;padding:56px 24px 96px}
.hero{font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hero-sub{font-size:19px;color:var(--text2);margin-top:10px;letter-spacing:-.015em}
.section{margin-top:52px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:6px 12px}
.section-h h2{font-size:22px;font-weight:600;letter-spacing:-.025em}
.section-h span,.muted{color:var(--text2);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{padding:20px 22px}
.stat b{display:block;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text2)}
.rows>*{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.rows>*:last-child{border-bottom:0}
.rows>button:hover,.rows>.hov:hover{background:var(--fill)}
.rows>*:first-child{border-radius:var(--r) var(--r) 0 0}.rows>*:last-child{border-radius:0 0 var(--r) var(--r)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{display:block;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:13px;color:var(--text3);white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:0}
.av.lg{width:76px;height:76px;font-size:27px}
.av.sm{width:26px;height:26px;font-size:10.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--fill2);color:var(--text2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.chip.orange{background:color-mix(in srgb,var(--orange) 13%,transparent);color:var(--orange)}
.chip.red{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:grid;place-items:center;color:transparent;transition:all .15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.empty{padding:44px 24px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:16px}
#onb{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:max(48px,env(safe-area-inset-top)) 20px 40px;animation:fade .25s}
.onb-in{width:100%;max-width:520px;margin:auto 0;position:relative;text-align:start}
.onb-in h1{font-size:40px;line-height:1.08;font-weight:700;letter-spacing:-.035em;margin:22px 0 14px}
.onb-in h2{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:18px 0 10px}
.onb-lead{color:var(--text2);font-size:17px;line-height:1.5;margin-bottom:26px}
.onb-mark{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--text);position:relative}.onb-mark i{position:absolute;inset:13px;border-radius:50%;background:var(--text)}
.onb-mark.ok{border:0;background:var(--green);color:#fff;display:grid;place-items:center}
.onb-f{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}.onb-f.onb-col{flex-direction:column;align-items:stretch}
.btn.lg{height:50px;font-size:16px;justify-content:center;border-radius:14px}
.onb-link{color:var(--accent);font:inherit;font-size:15px;padding:10px;min-height:44px}
.onb-cards{display:grid;gap:10px}
.onb-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:start;transition:border-color .15s}
.onb-card:hover{border-color:var(--accent)}.onb-card b{display:block;font-size:15.5px}.onb-card em{font-style:normal;color:var(--text2);font-size:13.5px}
.onb-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fill2);color:var(--accent);flex-shrink:0}
.onb-card.done .onb-ic{background:var(--green);color:#fff}
.onb-dots{display:flex;gap:6px;justify-content:center;margin-top:34px}.onb-dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.onb-dots i.on{background:var(--text)}
.onb-back{position:absolute;top:-40px;inset-inline-start:-8px}
@media(max-width:640px){.onb-in h1{font-size:34px}.onb-in h2{font-size:26px}}
.plist-more{display:block;margin:10px auto 16px}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}.fbar span{flex:1;min-width:0}
.fcheck{display:flex;align-items:center;gap:10px;font-size:15px;padding:8px 0;min-height:44px}.fcheck input{width:18px;height:18px;accent-color:var(--accent)}
.deal-next{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-act{margin-top:6px}.deal-act h5{margin:14px 0 8px}
.deal-hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}.deal-hist em{font-style:normal;color:var(--text2);font-size:12.5px}.deal-hist i{font-style:normal;color:var(--text3)}
.deal-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.deal-ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.deal-ev b{display:block;font-size:14px}.deal-ev span:not(.tl-ic){font-size:13px;color:var(--text2)}.deal-ev>div{min-width:0}
.deal-ev.up b{color:var(--accent)}
.deal-task{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}.deal-task>span:not(.chip){flex:1;min-width:0}.deal-task .chip{flex-shrink:0}
.deal-task.add{gap:6px}.deal-task.add .input:first-child{flex:1;min-width:0}
.keys>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.keys kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;margin-inline-start:4px;border-radius:6px;background:var(--fill2);border:1px solid var(--line2);font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.co-link{font:inherit;color:var(--accent);padding:0;min-height:0}
@media(max-width:640px){.tl-more{min-height:34px;min-width:44px;padding-inline:6px}.co-link{display:inline-flex;align-items:center;min-height:34px}.lk-row .icon-btn,.deal-task .icon-btn{width:40px!important;height:40px!important}}.co-link:hover{text-decoration:underline}
.co-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.co-stats>div{background:var(--fill);border-radius:14px;padding:12px 14px;min-width:0}.co-stats b{display:block;font-size:clamp(17px,5vw,22px);font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}.co-stats span{font-size:12.5px;color:var(--text2)}
.co-in{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px;margin-bottom:8px}.co-in svg{color:var(--accent);flex-shrink:0;margin-top:3px}
.co-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.co-deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.co-li>div{padding:8px 0;border-bottom:1px solid var(--line)}.co-li b{display:block;font-size:14px}.co-li span{font-size:12.5px;color:var(--text2)}
.lk-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.lk-row a{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:10px 0;color:var(--text)}.lk-row a:hover b{color:var(--accent)}
.lk-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--fill2);color:var(--accent);flex-shrink:0}.lk-ic svg{transform:rotate(45deg)}
.lk-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.lk-add .input{flex:1 1 180px;min-width:0}.lk-add [data-lk=label]{flex:0 1 150px}
.day-it{padding:14px 0;border-bottom:1px solid var(--line)}.day-h{display:flex;align-items:center;gap:12px}.day-h b{display:block;font-size:15px}.day-h span:not(.day-t){font-size:13px;color:var(--text2)}
.day-t{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:48px;color:var(--accent)}
.day-b{white-space:pre-wrap;font-size:14.5px;line-height:1.55;margin-top:8px;padding-inline-start:60px}
@media(max-width:640px){.day-b{padding-inline-start:0}}
.trip-why{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:5px}.trip-why .chip{height:22px;width:auto}
.tidy-row .select{flex-shrink:0}
.tidy-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.tidy-row input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}.tidy-row span span{font-size:13px;color:var(--text2)}.tidy-row s{color:var(--text3)}.tidy-to{font-style:normal;font-weight:600;color:var(--text)}
#pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 12px 10px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
#pickbar b{font-size:14px;margin-inline-end:6px}
@media(max-width:860px){#pickbar{bottom:calc(78px + env(safe-area-inset-bottom));left:10px;right:10px;transform:none;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding:8px 10px}#pickbar>*{flex-shrink:0;white-space:nowrap}}
.prow .pick-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0;color:#fff}
.prow.picked .pick-box{background:var(--accent);border-color:var(--accent)}.prow.picked{background:var(--accent-soft)}
.pick-all{padding:4px 8px}
.ck-bar,.deal-ck{display:block;height:5px;border-radius:9px;background:var(--fill2);overflow:hidden;margin:4px 0 8px}.ck-bar i,.deal-ck i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.deal-ck{margin:8px 0 2px}.deal-ck-t{display:flex!important;align-items:center;gap:4px;font-size:12px;color:var(--text2)}
.rates summary{cursor:pointer;color:var(--accent);font-size:14px;padding:6px 0}.rates-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.dmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.rc-path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.rc-arrow{color:var(--text3);display:inline-block}[dir=rtl] .rc-arrow{transform:scaleX(-1)}
.fc{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:16px 18px 12px;align-items:end}
.fc-c{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fc-v{font-size:11.5px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;height:16px;line-height:16px}
.fc-b{width:100%;max-width:44px;height:90px;display:flex;align-items:flex-end;background:var(--fill);border-radius:8px;overflow:hidden}.fc-b i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0;min-height:0}
.fc-c.late .fc-b i{background:var(--red)}.fc-c.none .fc-b i{background:var(--text3)}
.fc-l{font-size:12px;font-weight:500;white-space:nowrap;height:16px;line-height:16px}.fc-n{font-size:11px;color:var(--text3);height:14px;line-height:14px}
@media(max-width:640px){.fc{overflow-x:auto;grid-template-columns:repeat(9,56px);scrollbar-width:none}.fc-v{font-size:10.5px}}
.banner{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px;margin-bottom:28px;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--fill2);border-radius:10px;padding:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.input,.select,.textarea{width:100%;height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);outline:0;transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;min-height:110px;padding:11px 13px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field{display:block}
.field>span{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;display:grid;place-items:center;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}

/* ── People ── */
.people{display:grid;grid-template-columns:340px 1fr;height:100%}
.plist{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.plist-top>*{min-width:0;max-width:100%}
.plist-top{padding:18px 16px 10px;display:flex;flex-direction:column;gap:10px}
.plist-top h1{font-size:26px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;justify-content:space-between}
.plist-scroll{overflow-y:auto;flex:1;padding:0 8px 24px}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:start}
.prow:hover{background:var(--fill2)}
.prow.on{background:var(--accent-fill);color:#fff}
.prow.on .row-main span{color:rgba(255,255,255,.8)}
.prow.on .ring circle:first-child{stroke:rgba(255,255,255,.3)}.prow.on .ring circle:last-child{stroke:#fff}
.pdetail{overflow-y:auto;min-width:0}
.pd{max-width:760px;margin:0 auto;padding:44px 32px 96px}
.pd-head{display:flex;gap:22px;align-items:center}
.pd-head h1{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1}

mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

<script>
'use strict';
// ═══ Mnemo 2 — state, storage, helpers ═══════════════════════════════════
// Storage keys are shared with the classic version so existing data carries over.
const LS={clients:'ncrm3_clients',deals:'ncrm3_deals',cfg:'ncrm3_cfg',theme:'ncrm3_theme',li:'mnemo_li',sync:'mnemo_sync'};
const MODEL={smart:'claude-sonnet-5-5',fast:'claude-haiku-5-5'};

const events=c=>[
  ...(c.ints||[]).map(i=>({id:i.id,kind:KIND_ALIAS[i.src]||(KINDS[i.src]?i.src:'note'),title:i.title||'',date:i.date,text:i.tr||'',sum:i.sum||'',dur:i.dur||'',src:'ints',pending:!!i.pending})),

].filter(e=>e.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
// A planned meeting is not a conversation yet: only past events count as contact.
const isPast=e=>Date.parse(e.date)<=Date.now()+6e4;
const pastEvents=c=>events(c).filter(isPast);
const lastTouch=c=>pastEvents(c)[0]?.date||null;
// Relationship strength (0–100): recency of the last exchange, how often you speak, an open deal, and what is in motion.
function strengthParts(c){
  const ev=pastEvents(c),d=daysSince(ev[0]?.date);
  return{d,n:ev.length,recency:d===null?0:55*Math.exp(-d/45),freq:Math.min(30,9*Math.log2(1+ev.length)),
    deal:S.deals.some(x=>String(x.contactId)===String(c.id)&&!['won','lost'].includes(x.stage))?8:0,
    depth:Math.min(7,(c.tasks||[]).filter(x=>!x.done).length*2+(c.project?2:0)+(c.followon?1:0))};
}
function strength(c){const p=strengthParts(c);return Math.round(Math.min(100,p.recency+p.freq+p.deal+p.depth))}

function parseJSON(text){const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a<0||b<=a)return null;try{return JSON.parse(text.slice(a,b+1))}catch(e){return null}}
// Current Claude models think before answering, and thinking counts against max_tokens: keep effort low
// for quick extraction, leave room for the thinking, and treat a cut-off answer as a failure.
async function ai(prompt,{system,max=800,fast=false,effort}={}){
  const body={model:fast?MODEL.fast:MODEL.smart,max_tokens:Math.min(8000,max+3000),output_config:{effort:effort||(fast?'low':'medium')},messages:[{role:'user',content:prompt}]};
  if(system)body.system=system;
  const direct=!!S.cfg.ak,headers={'Content-Type':'application/json'};
  if(direct)Object.assign(headers,{'x-api-key':S.cfg.ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});else if(S.cfg.code)headers['X-Mnemo-Code']=S.cfg.code;
  const res=await fetch(direct?'https://api.anthropic.com/v1/messages':API+'/.netlify/functions/claude',{method:'POST',headers,body:JSON.stringify(body)});
  const d=await res.json().catch(()=>null);
  if(!res.ok||!d||d.error)throw Object.assign(new Error(d?.error?.message||'HTTP '+res.status),{code:d?.error?.code});
  const text=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  if(!text||d.stop_reason==='max_tokens'&&!/[}\].!?…]\s*$/.test(text))throw new Error(d.stop_reason==='refusal'?'The AI declined this request.':'The AI answer was cut off.');
  return text;
}

function dossier(c,limit=6000){
  const plans=events(c).filter(e=>!isPast(e)).map(e=>`- ${String(e.date).slice(0,16).replace('T',' ')} ${e.title}`).join('\n');
  const head=`${fn(c)} — ${c.role||''} @ ${c.company||''}\nProject: ${c.project||'-'} | Target: ${c.target||'-'} | Follow-on: ${c.followon||'-'} | Met: ${c.location||'-'} | Context: ${c.context||'-'}`;
  const ev=pastEvents(c).map(e=>`[${String(e.date).slice(0,10)} · ${e.kind}] ${e.title}\n${(e.text||e.sum).slice(0,1500)}`).join('\n\n');
  const tasks=(c.tasks||[]).filter(x=>!x.done).map(x=>`- ${x.title}${x.due?' (due '+x.due+')':''}`).join('\n');
  return(head+(plans?'\n\nPlanned (not happened yet):\n'+plans:'')+'\n\nOpen follow-ups:\n'+(tasks||'-')+'\n\nHistory (newest first):\n'+(ev||'-')).slice(0,limit);
}

// ═══ Shell: navigation, routing, sheets ══════════════════════════════════
const V={},A={},I={};
const TABS=[['today','Today'],['people','People'],['network','Network'],['map','Map'],['deals','Deals']];
function nav(){
  const n=remindersDue(),bd=k=>k==='today'&&n?`<span class="badge" aria-label="${t('{n} reminders',{n})}">${n}</span>`:'';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-a="go" data-v="${k}">${t(l)}${bd(k)}</button>`).join('');
  $('#tabbar').innerHTML=TABS.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-a="go" data-v="${k}">${ic(k,22)}${t(l)}${bd(k)}</button>`).join('');
  $('#search-btn').innerHTML=`${ic('search',15)}<span>${t('Search or ask')}</span><kbd>${/Mac|iPhone|iPad/.test(navigator.platform)?'⌘K':'Ctrl K'}</kbd>`;
  $('#capture-btn').innerHTML=`${ic('plus',15)}${t('Capture')}`;
  $('#settings-btn').innerHTML=ic('gear');syncBadge();
  document.documentElement.lang=S.cfg.lang;document.documentElement.dir=S.cfg.lang==='ar'?'rtl':'ltr';
}
const go=(view,id)=>{const h='#'+view+(id?'/'+id:'');if(location.hash===h)route();else location.hash=h};
function route(){
  const[v,id]=location.hash.slice(1).split('/');
  S.view=V[v]?v:'today';
  if(S.view==='people')S.sel=id&&person(id)?person(id).id:null;
  render(true);
}
function render(fresh){
  const keep=fresh?null:[...document.querySelectorAll('.pdetail,.plist-scroll')].map(e=>e.scrollTop),top=$('#view').scrollTop;
  nav();
  if(S.view!=='network')netStop();
  if(S.view!=='map')mapStop();
  $('#view').innerHTML=V[S.view]();
  if(S.view==='network')netStart();
  if(S.view==='map')mapStart();
  if(keep){document.querySelectorAll('.pdetail,.plist-scroll').forEach((e,i)=>e.scrollTop=keep[i]||0);$('#view').scrollTop=top}else $('#view').scrollTop=0;
  if(ONB.on)onbRender();
  if(S.pick&&S.view!=='people')S.pick=null;pickBar();
}

const undoSnap=()=>JSON.stringify({c:S.clients,d:S.deals});
function undoToast(msg,snap,after){toast(msg,{label:t('Undo'),run:()=>{const o=JSON.parse(snap);S.clients=o.c;S.deals=o.d;save();render();if(after)after();toast(t('Restored'))}})}
function toast(msg,act){const el=$('#toast');el.textContent=msg;el.classList.toggle('act',!!act);if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{el.classList.remove('on','act');act.run()};el.appendChild(b)}el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on','act'),act?7000:3200)}
function sheet(title,body,cls=''){
  $('#scrim').innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true"><div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-a="close" aria-label="Close">${ic('x')}</button></div><div class="sheet-b">${body}</div></div>`;

  setTimeout(()=>$('#scrim [autofocus]')?.focus(),60);
}

// ─── Staying in touch: cadence, birthdays, the years you were in touch, groups ───
const CADENCES=[[0,'Never'],[14,'Every 2 weeks'],[30,'Every month'],[90,'Every quarter'],[180,'Every 6 months']];
const cadenceName=n=>t((CADENCES.find(x=>x[0]===+n)||CADENCES[0])[1]);
const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const isoDay=s=>/^\d{4}-\d\d-\d\d/.test(String(s||''))?String(s).slice(0,10):'';
const dayDiff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
// Days until the next reconnect is due (negative = overdue); null when no cadence is set.
function dueIn(c){
  if(!+c.cadence)return null;
  const last=isoDay(lastTouch(c));if(!last)return 0;
  const d=new Date(last+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+(+c.cadence));
  return dayDiff(d.toISOString().slice(0,10),todayISO());
}
const dueText=d=>d<0?t('Overdue by {n} days',{n:-d}):d===0?t('Due today'):t('Due in {n} days',{n:d});
function nextBirthday(c){
  const m=String(c.birthday||'').match(/^\d{4}-(\d\d)-(\d\d)$/);if(!m)return null;
  const today=todayISO(),y=+today.slice(0,4);
  for(const yy of[y,y+1]){const d=new Date(Date.UTC(yy,+m[1]-1,+m[2])).toISOString().slice(0,10);const n=dayDiff(d,today);if(n>=0)return n}
  return null;
}
const bdayLabel=s=>{const d=new Date(isoDay(s)+'T00:00:00Z');return isNaN(d)?'':d.toLocaleDateString(locale(),{day:'numeric',month:'long',timeZone:'UTC'})};
// The years a person was part of your life: when you met, and every conversation since.
function yearsOf(c){const y=new Set;const m=isoDay(c.metOn);if(m)y.add(m.slice(0,4));for(const e of events(c)){const d=isoDay(e.date);if(d)y.add(d.slice(0,4))}return y}
const allYears=()=>[...new Set(S.clients.flatMap(c=>[...yearsOf(c)]))].sort().reverse();
const groupsAll=()=>{const m=new Map;for(const c of S.clients){const g=String(c.group||'').trim();if(g)m.set(g,(m.get(g)||0)+1)}return[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
const inYear=c=>!S.year||yearsOf(c).has(S.year);
const CHANNELS=['call','email','sms','whatsapp','meeting'];
const lastBy=(c,k)=>pastEvents(c).find(e=>e.kind===k)?.date||null;
// What needs you today: follow-ups due, reconnects due, birthdays today.
function remindersDue(){const d=todayISO();let n=upcoming(1).filter(o=>isoDay(o.e.date)===d).length;for(const c of S.clients){for(const x of c.tasks||[])if(!x.done&&x.due&&x.due<=d)n++;const r=dueIn(c);if(r!==null&&r<=0)n++;if(nextBirthday(c)===0)n++}return n}
A.qlog=el=>{const c=person(el.dataset.id),k=el.dataset.k;if(!c||!KINDS[k])return;const it={id:uid(),title:t(KINDS[k]),date:nowLocal(),src:k,tr:'',sum:''};c.ints.push(it);save();render();

function weekStats(off=0){
  const b=Date.now()-off*7*864e5,a=b-7*864e5,inW=d=>{const x=Date.parse(d);return x>a&&x<=b};
  const conv=S.clients.flatMap(c=>pastEvents(c).filter(e=>inW(e.date)).map(e=>({c,e})));
  const ppl=new Map();for(const o of conv)ppl.set(o.c,(ppl.get(o.c)||0)+1);
  const moved=S.deals.filter(d=>d.stageAt&&inW(d.stageAt));
  return{conv,ppl:[...ppl].sort((x,y)=>y[1]-x[1]),added:S.clients.filter(c=>c.createdAt&&inW(c.createdAt)),done:allTasks().filter(o=>o.x.done&&o.x.doneAt&&inW(o.x.doneAt)),moved,won:moved.filter(d=>d.stage==='won')};
}

// The People filters as one state, so a combination can be saved as a smart list and re-applied later.
// The city of a person: the one typed, else the one recognised in where you met (as on the map).
const cityOf=c=>String(c.city||'').trim()||(typeof placeOf==='function'&&placeOf(c)?.name)||'';
const citiesAll=()=>[...new Set(S.clients.map(cityOf).filter(Boolean))].sort();
const fState=()=>({filter:S.filter,chip:S.chip,year:S.year,q:S.q,...S.adv});
const fActive=f=>f.filter!=='all'||!!(f.chip||f.year||f.q||f.city||f.quiet||f.deal||f.due);
const openDeal=c=>S.deals.some(d=>String(d.contactId)===String(c.id)&&!['won','lost'].includes(d.stage));
const dueTask=c=>(c.tasks||[]).some(x=>!x.done&&x.due&&x.due<=todayISO());
function peopleList(f=fState()){
  const q=norm(f.q||''),filter=f.filter||'all';
  return S.clients.map(c=>({c,s:strength(c),last:lastTouch(c)}))
    .filter(o=>filter==='all'||circleOf(o.s)===+filter)
    .filter(o=>!f.chip||(f.chip==='#due'?(dueIn(o.c)!==null&&dueIn(o.c)<=0):String(o.c.group||'').trim()===f.chip))
    .filter(o=>!f.year||yearsOf(o.c).has(f.year))
    .filter(o=>!f.city||norm(cityOf(o.c))===norm(f.city))
    .filter(o=>{if(!f.quiet)return true;const d=daysSince(o.last);return d===null||d>=+f.quiet})

const PARTICLES=new Set(['de','du','des','la','le','van','von','der','den','da','di','dos','del']);
function titleCase(v){return String(v).toLocaleLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase()).split(' ').map((w,i)=>i&&PARTICLES.has(w.toLowerCase())?w.toLowerCase():w).join(' ')}
const shouty=v=>{v=String(v||'').trim();return v.length>1&&/\p{L}/u.test(v)&&(v===v.toLocaleUpperCase()&&v.replace(/[^\p{L}]/gu,'').length>3||v===v.toLocaleLowerCase())&&/^[\p{L}\s\-'’.]+$/u.test(v)};
function tidyList(){
  const out=[],add=(c,k,to,why)=>{if(String(c[k]??'')!==String(to))out.push({id:c.id,k,from:c[k]||'',to,why})};
  for(const c of S.clients){if(c.sample)continue;
    if(shouty(c.firstname))add(c,'firstname',titleCase(c.firstname.trim()),'Name capitals');
    if(shouty(c.name))add(c,'name',titleCase(c.name.trim()),'Name capitals');
    if(c.email&&c.email!==c.email.trim().toLowerCase())add(c,'email',c.email.trim().toLowerCase(),'E-mail format');
    if(c.linkedin&&!/^https?:\/\//i.test(c.linkedin)&&safeUrl(c.linkedin))add(c,'linkedin',safeUrl(c.linkedin),'LinkedIn link');
    if(!String(c.city||'').trim()&&c.location){const pl=typeof placeOf==='function'&&placeOf(c);if(pl&&!/^q:/.test(pl.key))add(c,'city',pl.name,'City from where you met')}
  }
  // one spelling per company: the most used one wins
  const by=new Map;for(const c of S.clients){if(c.sample||!c.company)continue;const k=normCo(c.company);if(!k)continue;const m=by.get(k)||new Map;m.set(c.company.trim(),(m.get(c.company.trim())||0)+1);by.set(k,m)}
  for(const[k,m]of by)if(m.size>1){const best=[...m].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0][0];for(const c of S.clients)if(!c.sample&&c.company&&normCo(c.company)===k&&c.company.trim()!==best)add(c,'company',best,'Same company')}
  return out;
}

function cadenceSuggestions(){const out=[];
  for(const c of S.clients){if(+c.cadence||c.cadenceAsked)continue;const ev=pastEvents(c);if(ev.length<3)continue;
    const last=daysSince(ev[0].date);if(last===null||last>365)continue;
    const ds=ev.map(e=>Date.parse(e.date)).sort((a,b)=>a-b),gaps=[];for(let i=1;i<ds.length;i++){const g=(ds[i]-ds[i-1])/864e5;if(g>=1)gaps.push(g)}
    if(gaps.length<2)continue;gaps.sort((a,b)=>a-b);const med=gaps[Math.floor(gaps.length/2)];
    const cad=[14,30,90,180].reduce((b,x)=>Math.abs(Math.log(x/med))<Math.abs(Math.log(b/med))?x:b,30);
    out.push({c,cad,med:Math.round(med)})}
  return out.sort((a,b)=>strength(b.c)-strength(a.c))}

// Stored on each person as links:[{id,why,via}] and unlinks:[id]; read both ways.
let LKM=null;
const wordsOf=s=>' '+String(s||'').replace(/[^\p{L}\p{N}]+/gu,' ')+' ';
function linkMap(){
  if(LKM)return LKM;
  const m=new Map,ids=new Map(S.clients.map(c=>[String(c.id),c])),no=new Set;
  for(const c of S.clients)for(const o of c.unlinks||[])no.add(String(c.id)+'|'+o),no.add(o+'|'+String(c.id));
  const add=(a,b,src,why)=>{
    if(!a||!b||a===b||!ids.has(a)||!ids.has(b))return;
    if(src==='notes'&&no.has(a+'|'+b))return;
    for(const[x,y]of[[a,b],[b,a]]){let s=m.get(x);if(!s)m.set(x,s=new Map);const e=s.get(y)||{src:new Set,why:''};e.src.add(src);if(why&&!e.why)e.why=why;s.set(y,e)}
  };

  // Names are indexed by their first word, so each note is scanned once whatever the size of the book.
  const full=new Map,firsts=new Map,multi=[],push=(m,k,v)=>{const a=m.get(k);if(a)a.push(v);else m.set(k,[v])};
  for(const c of S.clients){const f=norm(fn(c)).replace(/[^\p{L}\p{N}]+/gu,' ').trim();if(f.includes(' '))push(full,f.split(' ')[0],[' '+f+' ',c]);const g=first(c);if(g.length>=3)firsts.set(g,firsts.has(g)?null:c)}
  for(const[g,o]of firsts)if(o&&g.includes(' '))multi.push([' '+g.replace(/[^\p{L}\p{N}]+/gu,' ')+' ',o]);
  for(const c of S.clients){
    const k=String(c.id);
    for(const l of c.links||[])add(k,String(l.id),l.via==='voice'?'notes':'manual',l.why);
    if(c.introBy)add(k,String(c.introBy),'intro');
    const raw=events(c).map(e=>e.title+'\n'+e.text+'\n'+e.sum).join('\n');if(!raw.trim())continue;
    const lo=' '+norm(raw).replace(/[^\p{L}\p{N}]+/gu,' ')+' ',w=wordsOf(raw);
    for(const tk of new Set(lo.trim().split(' ')))for(const[f,o]of full.get(tk)||[])if(o!==c&&lo.includes(f))add(k,String(o.id),'notes');
    // A first name alone counts only mid-sentence: “Will stay two years” is not about Will.
    for(const mm of raw.matchAll(/[\p{L}\p{N}]+/gu)){const o=firsts.get(mm[0]);if(!o||o===c||mm.index===0||/[.!?…:;\n][\s"“«'(]*$/.test(raw.slice(Math.max(0,mm.index-4),mm.index)))continue;add(k,String(o.id),'notes')}
    for(const[g,o]of multi)if(o!==c&&w.includes(g))add(k,String(o.id),'notes');
  }
  return LKM=m;
}

    ${(l=>l.length?`<section class="section" style="margin-top:36px"><div class="section-h"><h2>${t('Introductions')}</h2></div><div class="card rows">${l.map(o=>`<button class="hov" data-a="intro" data-iid="${o.x.id}" style="text-align:start;width:100%"><span class="row-main"><b>${esc(fn(o.a))} → ${esc(fn(o.b))}</b><span>${esc(fmtDate(o.x.at))}${o.x.why?' · '+esc(o.x.why):''}</span></span><span class="chip ${o.x.status==='made'?'green':o.x.status==='declined'?'':'accent'}">${t(ST_INTRO[o.x.status])}</span></button>`).join('')}</div></section>`:'')(introsOf(c))}
    <section class="section" style="margin-top:36px"><div class="section-h"><h2>${t('Circle')}</h2><span>${lk.length?t('{n} connections in your network',{n:lk.length}):''}</span></div>
      <div class="card rows">${lk.map(([o,e])=>{const n=inCommon(c,o);return`<div class="hov">${av(fn(o))}<button class="row-main" data-a="go" data-v="people" data-id="${o.id}" style="text-align:start"><b>${esc(fn(o))}</b><span>${esc(linkLabel(c,o,e))}${n?' · '+t('{n} in common',{n}):''}</span></button>${ring(strength(o),26)}${e.src.has('intro')&&e.src.size===1?'':`<button class="icon-btn" style="width:28px;height:28px" data-a="unlink" data-id="${c.id}" data-o="${o.id}" aria-label="${t('Remove link')}">${ic('x',14)}</button>`}</div>`}).join('')}

A['unlink']=el=>{const c=person(el.dataset.id),o=person(el.dataset.o);if(!c||!o)return;
  for(const[x,y]of[[c,o],[o,c]]){x.links=(x.links||[]).filter(l=>String(l.id)!==String(y.id));x.unlinks=[...new Set([...(x.unlinks||[]),String(y.id)])]}
  save();render()};
A.pgroup=el=>{S.chip=el.dataset.k;S.sel=null;go('people')};
A.why=el=>{const c=person(el.dataset.id);if(!c)return;const p=strengthParts(c),s=strength(c);
  const bar=(l,v,max,hint)=>`<div class="why-r"><div class="why-h"><b>${l}</b><span dir="ltr">${Math.round(v)} / ${max}</span></div><div class="why-b"><i style="width:${Math.round(v/max*100)}%"></i></div><p class="hint">${hint}</p></div>`;
  const tips=[];
  if(p.d===null||p.d>7)tips.push(t('Talk to {name} this week: about +{n} points.',{name:first(c),n:Math.max(1,Math.round(55-p.recency+Math.min(30,9*Math.log2(2+p.n))-p.freq))}));
  if(!p.deal)tips.push(t('An open deal together adds 8 points.'));
  if(p.depth<7)tips.push(t('A follow-up or a project on the profile adds up to {n} points.',{n:7-Math.round(p.depth)}));
  sheet(t('Why {n}?',{n:s}),`<p class="hint" style="margin-bottom:12px">${t('{circle} · the score goes down slowly when you do not speak, and up each time you do.',{circle:t(CIRCLES[circleOf(s)])})}</p>
    ${bar(t('Recency'),p.recency,55,p.d===null?t('No conversation yet.'):t('Last spoke {when}.',{when:rel(lastTouch(c))}))}
    ${bar(t('Frequency'),p.freq,30,(p.n===1?t('1 conversation in total.'):t('{n} conversations in total.',{n:p.n})))}
    ${bar(t('Deal'),p.deal,8,p.deal?t('An open deal together.'):t('No open deal.'))}
    ${bar(t('In motion'),p.depth,7,t('Open follow-ups, project and next step on the profile.'))}
    ${tips.length?`<h5 style="margin:14px 0 6px">${t('To raise it')}</h5><ul class="why-tips">${tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="sheet-f"><button class="btn primary" data-a="draft" data-id="${c.id}">${ic('spark',14)}${t('Write a message')}</button></div>`)};
A['see-map']=el=>{NET.sel='c'+el.dataset.id;NET.grp=null;go('network')};
A['tl-more']=el=>{const p=el.previousElementSibling,d=el.nextElementSibling;p.hidden=!p.hidden;if(d)d.hidden=p.hidden;el.textContent=p.hidden?t('Show full notes'):t('Hide')};
A['ev-del']=el=>{const c=person(el.dataset.id);if(!c)return;const snap=undoSnap();c[el.dataset.src]=(c[el.dataset.src]||[]).filter(x=>String(x.id)!==el.dataset.e);save();render();undoToast(t('Memory deleted'),snap)};
A['task-toggle']=el=>{const x=person(el.dataset.id)?.tasks.find(x=>String(x.id)===el.dataset.t);if(x){x.done=!x.done;x.doneAt=x.done?new Date().toISOString():undefined;save();render()}};
A['task-del']=el=>{const c=person(el.dataset.id);if(!c)return;const snap=undoSnap();c.tasks=c.tasks.filter(x=>String(x.id)!==el.dataset.t);save();render();undoToast(t('Follow-up deleted'),snap)};

function personForm(c){
  const f=(k,l,x='')=>`<label class="field"><span>${t(l)}</span><input class="input" name="${k}" value="${esc(c?.[k]??'')}" ${x}></label>`;
  const others=S.clients.filter(x=>x.id!==c?.id).sort((a,b)=>fn(a).localeCompare(fn(b)));
  return`<form id="pf" class="sheet-b" style="padding:0" onsubmit="return false"><div class="grid2">${f('firstname','First name','autofocus')}${f('name','Last name')}</div><div class="grid2">${f('role','Role')}${f('company','Company')}</div><div class="grid2">${f('email','Email','type="email"')}${f('phone','Phone','type="tel"')}</div>${f('linkedin','LinkedIn','placeholder="linkedin.com/in/…"')}
    <label class="field"><span>${t('Group')}</span><input class="input" name="group" value="${esc(c?.group||'')}" list="groups-dl" placeholder="${t('e.g. Atlas deal, Riyadh investors')}" autocomplete="off"><datalist id="groups-dl">${groupsAll().map(([g])=>`<option value="${esc(g)}">`).join('')}</datalist></label>
    <h5>${t('What matters')}</h5>${f('project','Project')}${f('target','Target')}${f('followon','Next step')}
    <h5>${t('Where and when')}</h5><div class="grid2">${f('location','Where we met')}${f('metOn','When we met','type="date"')}</div>${f('city','City','placeholder="Dubai, Riyadh, Paris…"')}
    <label class="field"><span>${t('Context')}</span><textarea class="textarea" name="context" style="min-height:70px">${esc(c?.context||'')}</textarea></label>
    <h5>${t('Staying in touch')}</h5><div class="grid2"><label class="field"><span>${t('Keep in touch')}</span><select class="select" name="cadence">${CADENCES.map(([n,l])=>`<option value="${n}" ${+(c?.cadence||0)===n?'selected':''}>${t(l)}</option>`).join('')}</select></label>${f('birthday','Birthday','type="date"')}</div>
    <label class="field"><span>${t('Introduced by')}</span><select class="select" name="introBy"><option value="">—</option>${others.map(x=>`<option value="${x.id}" ${String(c?.introBy)===String(x.id)?'selected':''}>${esc(fn(x))}</option>`).join('')}</select></label>
    <div class="sheet-f">${c?.id?`<button class="btn danger" type="button" data-a="del-person" data-id="${c.id}">${t('Delete')}</button>`:''}<button class="btn" type="button" data-a="close">${t('Cancel')}</button><button class="btn primary" type="button" data-a="save-person" data-id="${c?.id||''}">${t('Save')}</button></div></form>`;
}
let DRAFT=null;
A['new-person']=()=>{DRAFT=null;sheet(t('New person'),personForm(null))};
A['edit-person']=el=>sheet(t('Edit'),personForm(person(el.dataset.id)));
A['save-person']=el=>{
  const d=Object.fromEntries(new FormData($('#pf')).entries());for(const k in d)d[k]=d[k].trim();
  if(!d.firstname&&!d.name){toast(t('A name is required.'));return}
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){toast(t('That email does not look right.'));return}
  d.introBy=d.introBy?(person(d.introBy)?.id??''):'';
  d.cadence=CADENCES.some(x=>x[0]===+d.cadence)?+d.cadence:0;
  for(const k of['metOn','birthday'])d[k]=/^\d{4}-\d\d-\d\d$/.test(d[k]||'')?d[k]:'';
  d.group=String(d.group||'').replace(/\s+/g,' ').slice(0,60);
  let c=el.dataset.id&&person(el.dataset.id);
  if(c)Object.assign(c,d);else{c={id:uid(),status:'prospect',category:'',tags:[],ints:[],tasks:[],createdAt:new Date().toISOString(),...(DRAFT||{}),...d};S.clients.unshift(c)}

function localSearch(q,list){
  const words=norm(q).split(/\s+/).filter(w=>w.length>2),out=[];
  for(const c of list)for(const e of events(c)){const hay=norm(e.title+' '+e.text+' '+e.sum),score=words.filter(w=>hay.includes(w)).length;if(score)out.push({c,e,score})}
  return out.sort((a,b)=>b.score-a.score||new Date(b.e.date)-new Date(a.e.date));
}

function recSegment(){
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m)),idx=REC.n++,chunks=[];
  const mr=new MediaRecorder(REC.stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:32000});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.done=new Promise(res=>mr.onstop=()=>{REC.blobs[idx]=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});res()});
  mr.start();REC.mr=mr;
}
A['rec-start']=async()=>{REC.when='';
  if(!CAP.pid){toast(t('Choose who this is about first.'));return}
  if(!navigator.mediaDevices||!window.MediaRecorder){CAP.state='error';CAP.msg=t('This browser cannot record audio.');return capture()}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){CAP.state='error';CAP.msg=t('Microphone access was refused. Allow it in your browser settings.');return capture()}
  REC.blobs=[];REC.n=0;REC.secs=0;REC.pending=[];recSegment();
  REC.tick=setInterval(()=>{REC.secs++;const el=$('#rec-time');if(el)el.textContent=mmss(REC.secs)},1000);
  // Long meetings are cut into 8-minute segments so each upload stays under the serverless body limit.
  REC.rot=setInterval(()=>{const old=REC.mr;REC.pending.push(old.done);recSegment();old.stop()},8*60e3);
  CAP.state='live';capture();
};

async function transcribe(blob){

  const d=await res.json().catch(()=>null);
  if(!res.ok||!d||d.error)throw Object.assign(new Error(d?.error?.message||'HTTP '+res.status),{code:d?.error?.code});
  return d.text||'';
}

function vqDb(){return VQ.db||(VQ.db=new Promise((res,rej)=>{const r=indexedDB.open('mnemo-voice',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}

async function voiceQueueRun(){

    for(const q of items){const c=person(q.pid),it=c?.ints.find(i=>String(i.id)===String(q.id));
      if(!c||!it){await vqTx('readwrite',st=>st.delete(q.id));continue}

      const tasks=Array.isArray(r?.tasks)?r.tasks.filter(x=>x&&x.title).slice(0,4):[];for(const x of tasks)c.tasks.push({id:uid(),title:String(x.title),due:/^\d{4}-\d\d-\d\d$/.test(x.due)?x.due:'',pri:'med',done:false});
      await vqTx('readwrite',st=>st.delete(q.id));save();render();
      toast(tasks.length?(tasks.length===1?t('Voice note for {name} transcribed — 1 follow-up added',{name:first(c)}):t('Voice note for {name} transcribed — {n} follow-ups added',{name:first(c),n:tasks.length})):t('Voice note for {name} transcribed',{name:first(c)}))}

  const d=todayISO();let last='';try{last=localStorage.getItem('mnemo_notified')||''}catch(e){}
  if(!force&&last===d)return;const n=remindersDue();if(!n)return;
  try{new Notification('Mnemo',{body:t('{n} reminders for today',{n}),icon:'icon.svg',tag:'mnemo-today'});localStorage.setItem('mnemo_notified',d)}catch(e){}
}
// ═══ Cloud sync (Supabase) ═══════════════════════════════════════════════
// Local-first: the app always works from localStorage. When signed in, every person,
// deal and the LinkedIn list is mirrored as one row each; the newest edit of a record wins.
// The publishable key is public by design; row level security is what protects the data.
const SB_DEFAULT={url:'https://bokgaovvctreikgcggwf.supabase.co',key:'sb_publishable_ySpvQHWifHy4z7aEgs1DLw_3v0e8g8T'};
const SYNC={s:null,uid:'',meta:{},cursor:'',at:0,busy:false,again:false,timer:0,state:'off',err:''};
const sbConf=()=>({url:String(S.cfg.syncUrl||SB_DEFAULT.url).trim().replace(/\/+$/,''),key:String(S.cfg.syncKey||SB_DEFAULT.key).trim()});
function syncLoad(){try{const d=JSON.parse(localStorage.getItem(LS.sync)||'{}');Object.assign(SYNC,{s:d.s||null,uid:d.uid||'',meta:d.meta||{},cursor:d.cursor||'',at:d.at||0})}catch(e){}SYNC.state=SYNC.s?'idle':'off'}
function syncStore(){try{localStorage.setItem(LS.sync,JSON.stringify({s:SYNC.s,uid:SYNC.uid,meta:SYNC.meta,cursor:SYNC.cursor,at:SYNC.at}))}catch(e){}}
const h53=str=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
function syncRecords(){
  const m=new Map;
  for(const c of S.clients)if(!c.sample)m.set('person:'+c.id,c);
  for(const d of S.deals)if(!d.sample)m.set('deal:'+d.id,d);
  const li=S.li.filter(x=>!x.sample);if(li.length)m.set('li:all',{list:li});
  return m;
}
// Stamp what changed locally since the last sync, and leave a tombstone for what was deleted.
function syncScan(){
  // On a device's very first sync, what is already in the account wins over same-id local copies.
  const now=Object.keys(SYNC.meta).length||SYNC.cursor?Date.now():1,recs=syncRecords();
  for(const[k,v]of recs){const h=h53(JSON.stringify(v)),m=SYNC.meta[k];if(!m||m.x||m.h!==h)SYNC.meta[k]={h,u:now,d:1}}
  for(const k in SYNC.meta)if(!recs.has(k)&&!SYNC.meta[k].x)SYNC.meta[k]={h:'',u:now,d:1,x:1};
  return recs;
}
function syncApply(r){
  const k=r.kind+':'+r.id,same=x=>String(x.id)===String(r.id);
  if(r.kind==='li')S.li=r.deleted?S.li.filter(x=>x.sample):(Array.isArray(r.data?.list)?r.data.list:[]);
  else{
    const key=r.kind==='person'?'clients':'deals',i=S[key].findIndex(same);
    if(r.deleted||!r.data){if(i>=0)S[key].splice(i,1)}
    else{if(r.kind==='person'){r.data.ints=r.data.ints||[];r.data.tasks=r.data.tasks||[]}if(i>=0)S[key][i]=r.data;else S[key].unshift(r.data)}
  }
  SYNC.meta[k]=r.deleted||!r.data?{h:'',u:r.updated_ms,d:0,x:1}:{h:h53(JSON.stringify(r.kind==='li'?{list:S.li}:r.data)),u:r.updated_ms,d:0};
}
async function sbFetch(path,opt={}){
  const{url,key}=sbConf();
  const res=await fetch(url+path,{method:opt.method||'GET',body:opt.body,headers:{apikey:key,'Content-Type':'application/json',...(SYNC.s&&!opt.noAuth?{Authorization:'Bearer '+SYNC.s.access_token}:{}),...(opt.headers||{})}});
  const txt=await res.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){}
  if(!res.ok)throw Object.assign(new Error(d?.error_description||d?.msg||d?.message||'HTTP '+res.status),{status:res.status});
  return d;
}
function sbSession(d){SYNC.s={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,id:d.user?.id||SYNC.s?.id,email:d.user?.email||SYNC.s?.email};syncStore()}
async function sbRefresh(){
  if(SYNC.s.exp-Date.now()>90e3)return;
  try{sbSession(await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',noAuth:true,body:JSON.stringify({refresh_token:SYNC.s.refresh_token})}))}
  catch(e){if(e.status>=400&&e.status<500){SYNC.s=null;throw new Error(t('Your session expired. Sign in again.'))}throw e}
}
function syncSet(state){SYNC.state=state;syncBadge();const el=$('#sync-panel');if(el)el.outerHTML=syncPanel()}
function syncBadge(){const b=$('#sync-btn');if(!b)return;b.hidden=SYNC.state==='off'&&!SYNC.err;b.className='icon-btn'+(SYNC.state==='syncing'?' busy':SYNC.state==='error'||SYNC.err?' err':'');b.innerHTML=ic('cloud');b.setAttribute('aria-label',t('Sync'));b.title=SYNC.err||t('Sync')}
function syncSoon(ms=1500){if(!SYNC.s)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncRun,ms)}
async function syncRun(){
  if(!SYNC.s)return;if(SYNC.busy){SYNC.again=true;return}
  SYNC.busy=true;syncSet('syncing');let changed=false;
  try{
    await sbRefresh();syncScan();
    for(;;){
      const rows=await sbFetch('/rest/v1/mnemo_items?select=kind,id,data,deleted,updated_ms,server_at&order=server_at.asc&limit=500'+(SYNC.cursor?'&server_at=gt.'+encodeURIComponent(SYNC.cursor):''));
      for(const r of rows){
        const m=SYNC.meta[r.kind+':'+r.id];SYNC.cursor=r.server_at;
        if(m&&((m.d&&m.u>=r.updated_ms)||(!m.d&&m.u===r.updated_ms&&!!m.x===!!r.deleted)))continue;
        syncApply(r);changed=true;
      }
      if(rows.length<500)break;
    }
    if(changed){if(hasSample()&&S.clients.some(c=>!c.sample)){const ids=new Set(S.clients.filter(c=>c.sample).map(c=>String(c.id)));S.clients=S.clients.filter(c=>!c.sample);S.deals=S.deals.filter(d=>!d.sample&&!ids.has(String(d.contactId)));S.li=S.li.filter(x=>!x.sample)}LIM=null;LKM=null;_save()}
    const recs=syncRecords(),dirty=Object.keys(SYNC.meta).filter(k=>SYNC.meta[k].d);
    for(let i=0;i<dirty.length;i+=50){
      const rows=dirty.slice(i,i+50).map(k=>{const m=SYNC.meta[k],j=k.indexOf(':');return{user_id:SYNC.s.id,kind:k.slice(0,j),id:k.slice(j+1),data:m.x?null:recs.get(k)??null,deleted:!!m.x,updated_ms:m.u}});
      await sbFetch('/rest/v1/mnemo_items?on_conflict=user_id,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
      rows.forEach(r=>{const m=SYNC.meta[r.kind+':'+r.id];if(m&&m.u===r.updated_ms)m.d=0});
    }
    SYNC.at=Date.now();SYNC.err='';syncStore();syncSet('idle');
  }catch(e){console.warn('sync',e);SYNC.err=e instanceof TypeError?t('Offline — changes are kept on this device and will sync later.'):e.message;syncStore();syncSet(SYNC.s?'error':'off')}
  finally{SYNC.busy=false;if(changed){if(S.sel&&!person(S.sel))S.sel=null;render()}if(SYNC.again){SYNC.again=false;syncSoon(300)}}
}
function syncPanel(){
  const c=sbConf(),inp=(id,l,x)=>`<label class="field"><span>${t(l)}</span><input class="input" id="${id}" ${x}></label>`;
  if(SYNC.s)return`<div id="sync-panel" style="display:flex;flex-direction:column;gap:10px"><p class="hint">${t('Signed in as')} <b style="color:var(--text)">${esc(SYNC.s.email||'')}</b> · ${SYNC.state==='syncing'?t('Syncing…'):SYNC.err?`<span style="color:var(--red)">${esc(SYNC.err)}</span>`:SYNC.at?t('Last synced')+' '+new Date(SYNC.at).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'}):t('Not synced yet')}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="sync-now">${t('Sync now')}</button><button class="btn sm" data-a="sync-out">${t('Sign out')}</button></div></div>`;
  return`<div id="sync-panel" style="display:flex;flex-direction:column;gap:10px"><p class="hint">${t('Sign in to keep your people, memories and deals in sync across your devices.')}${SYNC.err?` <span style="color:var(--red)">${esc(SYNC.err)}</span>`:''}</p>
    <div class="grid2">${inp('sync-email','Email','type="email" autocomplete="username"')}${inp('sync-pw','Password','type="password" autocomplete="current-password" data-enter="sync-in"')}</div>
    <details ${c.key?'':'open'}><summary class="hint" style="cursor:pointer">${t('Supabase project')}</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${inp('sync-url','Project URL',`value="${esc(c.url)}" placeholder="https://xxxx.supabase.co"`)}${inp('sync-key','Publishable (anon) key',`type="password" value="${esc(c.key)}" autocomplete="off"`)}</div></details>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-a="sync-in">${t('Sign in')}</button><button class="btn sm" data-a="sync-up">${t('Create account')}</button></div></div>`;
}
async function syncAuth(signup){
  const email=$('#sync-email').value.trim(),password=$('#sync-pw').value,url=$('#sync-url').value.trim(),key=$('#sync-key').value.trim();
  if(!/^https:\/\/[\w.-]+$/.test(url.replace(/\/+$/,''))||!key){toast(t('Enter your Supabase project URL and publishable key.'));return}
  if(!email||password.length<6){toast(t('Enter an email and a password of at least 6 characters.'));return}
  S.cfg.syncUrl=url;S.cfg.syncKey=key;saveCfg();SYNC.err='';
  try{
    const d=await sbFetch(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',noAuth:true,body:JSON.stringify({email,password})});
    if(!d?.access_token){toast(t('Account created. Confirm it from the email you just received, then sign in.'));return}
    if(SYNC.uid&&SYNC.uid!==d.user?.id){SYNC.meta={};SYNC.cursor=''}
    SYNC.uid=d.user?.id||'';SYNC.s=null;sbSession(d);syncSet('idle');toast(t('Signed in'));syncRun();
  }catch(e){toast(e instanceof TypeError?t('Could not reach Supabase. Check the project URL.'):e.message)}
}
A['sync-in']=()=>syncAuth(false);
A['sync-up']=()=>syncAuth(true);
A['sync-now']=()=>syncRun();
A['sync-out']=()=>{if(!confirm(t('Sign out? Your data stays on this device.')))return;const s=SYNC.s;if(s)sbFetch('/auth/v1/logout',{method:'POST'}).catch(()=>{});clearTimeout(SYNC.timer);Object.assign(SYNC,{s:null,uid:'',meta:{},cursor:'',at:0,err:''});syncStore();syncSet('off')};
function syncBoot(){
  syncLoad();syncBadge();if(SYNC.s)syncRun();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(200)});
  window.addEventListener('online',()=>syncSoon(200));
  setInterval(()=>{if(!document.hidden)syncSoon(0)},60e3);
}

// ═══ Boot ════════════════════════════════════════════════════════════════
load();applyTheme();syncLoad();route();syncBoot();
if(ONB.on)onbRender();

  if(!title&&!text&&!url&&!act)return;
  const keep=new URLSearchParams(location.search);['share_title','share_text','share_url','do'].forEach(k=>keep.delete(k));
  history.replaceState(null,'',location.pathname+(keep.toString()?'?'+keep:'')+location.hash);
  if(ONB.on)return;
  setTimeout(()=>{
    if(act==='record')return A.capture({dataset:{tab:'voice'}});
    if(act==='new')return A['new-person']();
    const link=url||(text.match(/https?:\/\/\S+/)||[])[0]||'';
    if(act==='tell'||(!/linkedin\.com\/in\//i.test(link)&&!(text.length>200&&/\n/.test(text)))){go('today');setTimeout(()=>{TD.text=[title,text,url&&!text.includes(url)?url:''].filter(Boolean).join(' ').trim();const i=$('#tell-in');if(i){i.value=TD.text;i.focus()}},150);return}
    if(/linkedin\.com\/in\//i.test(link)){const nm=(title.replace(/\s*[|–-]\s*LinkedIn.*$/i,'')||'').split(/\s+[|–-]\s+/)[0].trim().split(/\s+/);DRAFT=null;sheet(t('New person'),personForm({firstname:nm[0]||'',name:nm.slice(1).join(' '),linkedin:link}));toast(t('LinkedIn profile received — check the name and save.'));return}
    MAIL.text=text;A.mail();MAIL.text='';
  },300);
})();
if('serviceWorker'in navigator&&location.protocol==='https:'&&!NATIVE)navigator.serviceWorker.register('sw.js').catch(()=>{});setTimeout(notifyToday,1500);
