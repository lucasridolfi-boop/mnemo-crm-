name: Android app

# Builds an installable test version of the Mnemo Android app whenever the web app or the
# mobile project changes. Download it from the run's "Artifacts" section.
on:
  push:
    branches: [main, main-hd09fy]
    paths: ['index.html', 'icon.svg', 'manifest.webmanifest', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Copy the web app into the Android project
        run: npm run build && npx cap sync android
      - name: Build the test APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mnemo-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
